name: V5.1 evidence-visible course and V4 LoRA continuation
on:
  push:
    branches: [main]
    paths:
      - '*v51*'
      - 'src/wengua/*v51.py'
      - 'scripts/*v51*'
      - 'tests/test_course_repair_v51.py'
      - 'configs/course_v51*'
      - 'data/knowledge/course_v51/**'
      - 'data/delivery/course_v51/**'
      - '.github/workflows/course_repair_v51.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-stdlib:
    runs-on: windows-latest
    steps:
      - name: Preserve canonical source bytes for frozen hash assertions (CI only)
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 -m unittest tests.test_course_repair_v51 -v
      - run: python -X utf8 -m scripts.check_course_v51_windows
      - run: python -X utf8 run_course_v51.py plan
      - shell: pwsh
        run: |
          cmd /c train_wengua_v51.cmd
          if ($LASTEXITCODE -ne 2) { throw "Missing training environment must stop safely" }
          exit 0
  tiny-cpu-warm-start-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1
      - run: python -m scripts.check_course_v51_training
      - uses: actions/upload-artifact@v4
        with:
          name: v51-real-tiny-cpu-not-cuda
          path: local/course_v51/tiny_integration.json
