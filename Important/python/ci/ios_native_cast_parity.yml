  real_ios_xcode_build:
    runs-on: macos-15
    needs: native_core
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and generate real iOS Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          cd ios/WenguaAppUI
          xcodegen generate --spec project.yml
      - name: Build real SwiftUI app and Foundation offline casting core for iOS simulator
        run: |
          xcodebuild -project ios/WenguaAppUI/WenguaApp.xcodeproj \
            -scheme WenguaApp -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/wengua-ios-derived \
            CODE_SIGNING_ALLOWED=NO build
      - name: Preserve unsigned iOS Simulator debug app (NOT an iPhone IPA)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wengua-unsigned-simulator-debug-app
          path: /tmp/wengua-ios-derived/Build/Products/Debug-iphonesimulator/问卦.app/
          retention-days: 30
          if-no-files-found: error

