name: iOS Offline Native Casting Parity
on:
  push:
    branches: [main]
    paths:
      - 'ios/WenguaAppUI/WenguaNativeCore.swift'
      - 'ios/WenguaAppUI/WenguaHealthTemplateBridge.swift'
      - 'ios/WenguaAppUI/WenguaNativeReadingRouter.swift'
      - 'ios/WenguaAppUI/WenguaNativeActorBinding.swift'
      - 'ios/WenguaAppUI/NativeActorProfileCheck.swift'
      - 'tests/test_ios_vnext_production_entry_20261026.py'
      - 'data/knowledge/phrase_library/health_v20/actor_profiles.json'
      - 'ios/WenguaAppUI/WenguaNativeVNextEngine.swift'
      - 'ios/WenguaAppUI/WenguaVNextCustomerComposer.swift'
      - 'ios/WenguaAppUI/WenguaVNextReasoner.swift'
      - 'ios/WenguaAppUI/WenguaPythonVNextVerbatim.swift'
      - 'ios/WenguaAppUI/WenguaVNextTianrui25.swift'
      - 'ios/WenguaAppUI/VNextNativeParityCheck.swift'
      - 'scripts/export_ios_vnext_live_parity.py'
      - 'scripts/ios_vnext_three_random_20261026.py'
      - 'tests/compare_gpt_ios_exact_wording_20261026.py'
      - 'ios/WenguaAppUI/VNextThreeRandomNativeFullCheck.swift'
      - 'data/evaluation/health_vnext/ios_native_vnext_python_parity_20261026.json'
      - 'ios/WenguaAppUI/WenguaNativeCustomerView.swift'
      - 'ios/WenguaAppUI/WenguaLocalHistoryView.swift'
      - 'ios/WenguaAppUI/WenguaNativeEnergyBundle.swift'
      - 'ios/WenguaAppUI/Native200SourceCheck.swift'
      - 'ios/WenguaAppUI/PrivacyInfo.xcprivacy'
      - 'tests/test_ios_privacy_manifest_20261026.py'
      - 'data/mobile/health_vnext/health_energy_200.json'
      - 'scripts/export_ios_health_energy_200.py'
      - 'tests/test_ios_energy_200_source_parity.py'
      - 'ios/WenguaAppUI/NativeHealthCustomerCheck.swift'
      - 'ios/WenguaAppUI/HealthTemplateBridgeCheck.swift'
      - 'data/templates/health_severity_vnext/reading_template.json'
      - 'data/knowledge/health_81_excel_20261025/81_pairs.tsv'
      - 'tests/test_ios_health_template_bridge_20261026.py'
      - 'ios/WenguaAppUI/NativeParityMain.swift'
      - 'ios/WenguaAppUI/GoldenNativeCastCases.json'
      - 'ios/WenguaAppUI/WenguaDesignPreviewApp.swift'
      - 'ios/WenguaAppUI/project.yml'
      - 'tests/test_ios_native_cast_against_python.py'
      - 'tests/test_ios_five_random_live_casts.py'
      - '.github/workflows/ios_native_cast_parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_core:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile TRUE offline Swift executable (Foundation, no simulator)
        run: |
          which swiftc
          swiftc --version
          swiftc ios/WenguaAppUI/WenguaNativeCore.swift ios/WenguaAppUI/NativeParityMain.swift -o /tmp/wengua-native
      - name: Compute four new astronomical boards in Swift and compare with original sealed Python fixtures
        run: |
          /tmp/wengua-native ios/WenguaAppUI/GoldenNativeCastCases.json > /tmp/wengua-native-results.json
          python3 tests/test_ios_native_cast_against_python.py /tmp/wengua-native-results.json
      - name: Five fresh reproducible random hours - independent source-Python versus offline-Swift complete plate
        run: |
          mkdir -p /tmp/wengua-five
          python3 tests/test_ios_five_random_live_casts.py /tmp/wengua-native /tmp/wengua-five
      - name: Preserve five-hour evidence, accepted and rejected candidates (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-new-true-charts-and-pillar-template-audit
          path: /tmp/wengua-five/
          retention-days: 90
          if-no-files-found: warn
      - name: Real Swift cast -> exact editable template and 81 Excel pairs (plus broken-TSV rejection)
        run: |
          swiftc ios/WenguaAppUI/WenguaNativeCore.swift ios/WenguaAppUI/WenguaHealthTemplateBridge.swift ios/WenguaAppUI/HealthTemplateBridgeCheck.swift -o /tmp/wengua-health-template-bridge
          /tmp/wengua-health-template-bridge data/templates/health_severity_vnext/reading_template.json data/knowledge/health_81_excel_20261025/81_pairs.tsv
      - name: Offline Swift native domain/relationship/template/customer narrative test
        run: |
          swiftc ios/WenguaAppUI/WenguaNativeCore.swift ios/WenguaAppUI/WenguaHealthTemplateBridge.swift ios/WenguaAppUI/WenguaNativeEnergyBundle.swift ios/WenguaAppUI/WenguaNativeActorBinding.swift ios/WenguaAppUI/WenguaNativeVNextEngine.swift ios/WenguaAppUI/WenguaVNextCustomerComposer.swift ios/WenguaAppUI/WenguaVNextReasoner.swift ios/WenguaAppUI/WenguaVNextTianrui25.swift ios/WenguaAppUI/WenguaPythonVNextVerbatim.swift ios/WenguaAppUI/WenguaNativeReadingRouter.swift ios/WenguaAppUI/NativeHealthCustomerCheck.swift -o /tmp/wengua-customer
          /tmp/wengua-customer data/templates/health_severity_vnext/reading_template.json data/knowledge/health_81_excel_20261025/81_pairs.tsv data/mobile/health_vnext/health_energy_200.json
      - name: Audit all 20 original actor profiles in actual Swift runtime
        run: |
          swiftc ios/WenguaAppUI/WenguaNativeCore.swift ios/WenguaAppUI/WenguaNativeActorBinding.swift ios/WenguaAppUI/WenguaHealthTemplateBridge.swift ios/WenguaAppUI/WenguaNativeEnergyBundle.swift ios/WenguaAppUI/WenguaNativeVNextEngine.swift ios/WenguaAppUI/WenguaVNextCustomerComposer.swift ios/WenguaAppUI/WenguaVNextReasoner.swift ios/WenguaAppUI/WenguaVNextTianrui25.swift ios/WenguaAppUI/WenguaPythonVNextVerbatim.swift ios/WenguaAppUI/WenguaNativeReadingRouter.swift ios/WenguaAppUI/NativeActorProfileCheck.swift -o /tmp/wengua-actor-check
          /tmp/wengua-actor-check data/knowledge/phrase_library/health_v20/actor_profiles.json
      - name: Verify exact 200 source cells and native offline loader
        run: |
          python3 -m scripts.export_ios_health_energy_200 --check
          swiftc ios/WenguaAppUI/WenguaNativeCore.swift ios/WenguaAppUI/WenguaHealthTemplateBridge.swift ios/WenguaAppUI/WenguaNativeEnergyBundle.swift ios/WenguaAppUI/Native200SourceCheck.swift -o /tmp/wengua-native-200
          /tmp/wengua-native-200 data/mobile/health_vnext/health_energy_200.json
      - name: Full signed V-next Swift-to-Python current truth parity (two actual hours)
        run: |
          swiftc ios/WenguaAppUI/WenguaNativeCore.swift ios/WenguaAppUI/WenguaHealthTemplateBridge.swift ios/WenguaAppUI/WenguaNativeEnergyBundle.swift ios/WenguaAppUI/WenguaNativeActorBinding.swift ios/WenguaAppUI/WenguaPythonVNextVerbatim.swift ios/WenguaAppUI/WenguaNativeReadingRouter.swift ios/WenguaAppUI/WenguaNativeVNextEngine.swift ios/WenguaAppUI/WenguaVNextCustomerComposer.swift ios/WenguaAppUI/WenguaVNextReasoner.swift ios/WenguaAppUI/WenguaVNextTianrui25.swift ios/WenguaAppUI/VNextNativeParityCheck.swift -o /tmp/wengua-vnext-parity
          python3 -m scripts.export_ios_vnext_live_parity --output /tmp/wengua-vnext-five-current.json
          /tmp/wengua-vnext-parity data/mobile/health_vnext/health_energy_200.json /tmp/wengua-vnext-five-current.json
      - name: Independently check 3 new randomly drawn real instants and compose iOS current JSON text
        run: |
          set -euo pipefail
          mkdir -p /tmp/wengua-vnext-three
          python3 -m scripts.ios_vnext_three_random_20261026 --output /tmp/wengua-vnext-three/python_truth.json
          swiftc ios/WenguaAppUI/WenguaNativeCore.swift ios/WenguaAppUI/WenguaHealthTemplateBridge.swift ios/WenguaAppUI/WenguaNativeEnergyBundle.swift ios/WenguaAppUI/WenguaNativeActorBinding.swift ios/WenguaAppUI/WenguaNativeReadingRouter.swift ios/WenguaAppUI/WenguaNativeVNextEngine.swift ios/WenguaAppUI/WenguaVNextCustomerComposer.swift ios/WenguaAppUI/WenguaVNextReasoner.swift ios/WenguaAppUI/WenguaVNextTianrui25.swift ios/WenguaAppUI/WenguaPythonVNextVerbatim.swift ios/WenguaAppUI/VNextThreeRandomNativeFullCheck.swift -o /tmp/wengua-vnext-three-native
          /tmp/wengua-vnext-three-native /tmp/wengua-vnext-three/python_truth.json data/knowledge/health_81_excel_20261025/81_pairs.tsv data/mobile/health_vnext/health_energy_200.json data/templates/health_severity_vnext/reading_template.json | tee /tmp/wengua-vnext-three/swift_public_readings.log
      - name: STRICT full GPT Python reading_text versus native iOS every Chinese character - release gate
        run: |
          if ! python3 tests/compare_gpt_ios_exact_wording_20261026.py /tmp/wengua-vnext-three/python_truth.json /tmp/wengua-vnext-three/swift_public_readings.log /tmp/wengua-vnext-three/exact_wording_diff.md; then
            echo "STRICT GPT/PYTHON VS IOS FULL TEXT DIFF (first 500 lines):"
            sed -n '1,500p' /tmp/wengua-vnext-three/exact_wording_diff.md
            exit 1
          fi
      - name: Preserve 3 truly random Python and Swift evidence whether passing or failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnext-three-new-random-swift-python-parity-20261026
          path: /tmp/wengua-vnext-three/
          retention-days: 90
          if-no-files-found: warn
      - name: Draw NINE additional fresh hours and run independently on real Swift production router
        run: |
          set -euo pipefail
          mkdir -p /tmp/wengua-vnext-nine
          python3 -m scripts.ios_vnext_three_random_20261026 --seed 202610265117 --count 9 --output /tmp/wengua-vnext-nine/python_truth.json
          /tmp/wengua-vnext-three-native /tmp/wengua-vnext-nine/python_truth.json data/knowledge/health_81_excel_20261025/81_pairs.tsv data/mobile/health_vnext/health_energy_200.json data/templates/health_severity_vnext/reading_template.json | tee /tmp/wengua-vnext-nine/swift_public_readings.log
      - name: HARD GATE nine new clocks complete GPT Python versus shipped iOS paragraphs and section order
        run: |
          if ! python3 tests/compare_gpt_ios_exact_wording_20261026.py /tmp/wengua-vnext-nine/python_truth.json /tmp/wengua-vnext-nine/swift_public_readings.log /tmp/wengua-vnext-nine/exact_wording_diff.md; then
            sed -n '1,500p' /tmp/wengua-vnext-nine/exact_wording_diff.md
            exit 1
          fi
      - name: Preserve NINE-hour fresh Python Swift parity and any diffs even when red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnext-nine-new-random-swift-python-parity-20261026
          path: /tmp/wengua-vnext-nine/
          retention-days: 90
          if-no-files-found: warn
      - name: NEW two-wife randomized real clock Python and actual iOS production Swift narratives
        run: |
          set -euo pipefail
          mkdir -p /tmp/wengua-two-wife
          python3 -m scripts.ios_vnext_three_random_20261026 --seed 202610268047 --count 2 --wife-only --output /tmp/wengua-two-wife/python_truth.json
          /tmp/wengua-vnext-three-native /tmp/wengua-two-wife/python_truth.json data/knowledge/health_81_excel_20261025/81_pairs.tsv data/mobile/health_vnext/health_energy_200.json data/templates/health_severity_vnext/reading_template.json | tee /tmp/wengua-two-wife/swift_public_readings.log
      - name: HARD GATE both wife charts Python reading versus iOS exact literal and metadata
        run: |
          set -euo pipefail
          if ! python3 tests/compare_gpt_ios_exact_wording_20261026.py /tmp/wengua-two-wife/python_truth.json /tmp/wengua-two-wife/swift_public_readings.log /tmp/wengua-two-wife/exact_wording_diff.md; then
            sed -n '1,500p' /tmp/wengua-two-wife/exact_wording_diff.md
            exit 1
          fi
      - name: Produce and print verbatim two-wife Python and actual production Swift reading, side by side
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/wengua-two-wife")
          src=json.loads((p/"python_truth.json").read_text(encoding="utf8"))
          raw=(p/"swift_public_readings.log").read_text(encoding="utf8").splitlines()
          ios=[json.loads(x.split("VNEXT_IOS_PYEXACT=",1)[1]) for x in raw if "VNEXT_IOS_PYEXACT=" in x]
          assert len(ios)==len(src["cases"])==2
          out=["# 2026-10-26 两张新随机妻子测病盘：Python 原稿与 Swift 真生产断案全文","","新种子：202610268047；仅剔除引擎无法完成的技术输入，不按吉凶抽选。"]
          for i,(a,b) in enumerate(zip(src["cases"],ios),1):
              assert a["instant"]==b["instant"] and a["relationship"]==b["relationship"]=="妻子"
              sw="\n\n".join(x["title"]+"：\n"+x["text"] for x in b["sections"])
              out.extend(["",f"## 第{i}盘 | {a['instant']} | 妻子",
                          f"四柱：{'／'.join(b['pillars'])}；{b['solar_term']}；{b['bureau']}",
                          "### GPT / Python 原代码断案",a["python_reading_text"],
                          "### iOS / Swift 生产 Router 断案",sw,
                          f"逐字完全相同：{a['python_reading_text']==sw}；段落数量：{len(b['sections'])}"])
          out.extend(["","## 无法正常计算而拒绝的原始抽样记录",
            json.dumps(src["rejected"],ensure_ascii=False,indent=2)])
          rendered="\n\n".join(out)+"\n"
          (p/"python_swift_two_wife_full_readings.md").write_text(rendered,encoding="utf8")
          print("TWO_WIFE_FULL_READINGS_START")
          print(rendered)
          print("TWO_WIFE_FULL_READINGS_END")
          PY
      - name: Preserve two wife Python originals, Swift product output, report and complete readable text even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-wife-verbatim-python-ios-vnext-20261026
          path: /tmp/wengua-two-wife/
          retention-days: 90
          if-no-files-found: warn
      - name: V6 one new random wife clock with revised cohost and two independent plus-three rules
        run: |
          set -euo pipefail
          mkdir -p /tmp/wengua-v6-one
          python3 -m scripts.ios_vnext_three_random_20261026 --seed 202610269113 --count 1 --wife-only --output /tmp/wengua-v6-one/python_truth.json
          /tmp/wengua-vnext-three-native /tmp/wengua-v6-one/python_truth.json data/knowledge/health_81_excel_20261025/81_pairs.tsv data/mobile/health_vnext/health_energy_200.json data/templates/health_severity_vnext/reading_template.json | tee /tmp/wengua-v6-one/swift_public_readings.log
          python3 tests/compare_gpt_ios_exact_wording_20261026.py /tmp/wengua-v6-one/python_truth.json /tmp/wengua-v6-one/swift_public_readings.log /tmp/wengua-v6-one/exact_wording_diff.md
      - name: Archive verbatim single new Python and actual Swift reading for review
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/wengua-v6-one")
          data=json.loads((root/"python_truth.json").read_text(encoding="utf8"))
          lines=(root/"swift_public_readings.log").read_text(encoding="utf8").splitlines()
          ios=[json.loads(line.split("VNEXT_IOS_PYEXACT=",1)[1]) for line in lines
               if "VNEXT_IOS_PYEXACT=" in line]
          assert len(ios)==len(data["cases"])==1
          a,b=data["cases"][0],ios[0]
          swift="\n\n".join(x["title"]+"：\n"+x["text"] for x in b["sections"])
          assert a["python_reading_text"]==swift
          doc=("\n".join([
              "# V6 one new actual random wife chart Python and Swift source readings",
              "seed: 202610269113, no outcome selection",
              "instant: "+a["instant"],
              "pillars: "+"／".join(b["pillars"]),
              "bureau: "+b["bureau"],
              "### Python",
              a["python_reading_text"],
              "### Swift",
              swift,
              "全文原字一致: True",
              "### Technical draws rejected",
              json.dumps(data["rejected"],ensure_ascii=False,indent=2)]))+"\n"
          (root/"one_wife_python_swift_verbatim.md").write_text(doc,encoding="utf8")
          print("V6_ONE_RANDOM_VERBATIM_START")
          print(doc)
          print("V6_ONE_RANDOM_VERBATIM_END")
          PY
      - name: Preserve V6 one-random-clock real Python Swift evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-one-wife-python-swift-verbatim-20261026
          path: /tmp/wengua-v6-one/
          retention-days: 90
          if-no-files-found: warn
      - name: V6.1 fresh independent random wife illness test at latest source (2026-10-27)
        run: |
          set -euo pipefail
          mkdir -p /tmp/wengua-v61-wife-new
          python3 -m scripts.ios_vnext_three_random_20261026 --seed 347058956909 --count 1 --wife-only --output /tmp/wengua-v61-wife-new/python_truth.json
          /tmp/wengua-vnext-three-native /tmp/wengua-v61-wife-new/python_truth.json data/knowledge/health_81_excel_20261025/81_pairs.tsv data/mobile/health_vnext/health_energy_200.json data/templates/health_severity_vnext/reading_template.json | tee /tmp/wengua-v61-wife-new/swift_public_readings.log
          python3 tests/compare_gpt_ios_exact_wording_20261026.py /tmp/wengua-v61-wife-new/python_truth.json /tmp/wengua-v61-wife-new/swift_public_readings.log /tmp/wengua-v61-wife-new/exact_wording_diff.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/wengua-v61-wife-new")
          src=json.loads((p/"python_truth.json").read_text(encoding="utf8"))
          app=[json.loads(x.split("VNEXT_IOS_PYEXACT=",1)[1]) for x in (p/"swift_public_readings.log").read_text(encoding="utf8").splitlines() if "VNEXT_IOS_PYEXACT=" in x]
          assert len(src["cases"])==len(app)==1
          a,b=src["cases"][0],app[0]
          swift="\n\n".join(s["title"]+"：\n"+s["text"] for s in b["sections"])
          assert a["python_reading_text"]==swift
          doc="\n".join(["# Wengua V6.1 new independent random wife illness-severity software cast","Seed: 347058956909","Random draw: "+str(a["draw"]),"Local datetime: "+a["instant"],"Four pillars: "+"／".join(b["pillars"]),"Solar term: "+b["solar_term"],"Bureau: "+b["bureau"],"Python:",a["python_reading_text"],"Swift production router:",swift,"Exact full text: True","Rejected draws:",json.dumps(src["rejected"],ensure_ascii=False,indent=2)])+"\n"
          (p/"v61_new_wife_python_swift_full_reading.md").write_text(doc,encoding="utf8")
          print("V61_NEW_WIFE_FULL_READING_START")
          print(doc)
          print("V61_NEW_WIFE_FULL_READING_END")
          PY
      - name: Commit the exact newly generated V6.1 full wife reading to project history
        run: |
          set -euo pipefail
          cp /tmp/wengua-v61-wife-new/v61_new_wife_python_swift_full_reading.md docs/HEALTH_V61_RANDOM_WIFE_2026-10-27.md
          printf '\nGitHub Action: https://github.com/turnupmason/WenguaApp/actions/runs/%s\nSource SHA: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" >> docs/HEALTH_V61_RANDOM_WIFE_2026-10-27.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HEALTH_V61_RANDOM_WIFE_2026-10-27.md
          git commit -m "Archive V6.1 newly randomized wife chart full Python and native Swift reading"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve V6.1 new wife full Python and native Swift readings, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v61-new-wife-python-swift-full-reading-20261027
          path: /tmp/wengua-v61-wife-new/
          retention-days: 90
          if-no-files-found: warn
      - name: User supplied 1930-born female four pillars - native Swift versus Python exact parity
        run: |
          set -euo pipefail
          mkdir -p /tmp/wengua-1930-manual
          python3 -m scripts.ios_vnext_manual_birth_20261027 --output /tmp/wengua-1930-manual/python_truth.json
          /tmp/wengua-vnext-three-native /tmp/wengua-1930-manual/python_truth.json data/knowledge/health_81_excel_20261025/81_pairs.tsv data/mobile/health_vnext/health_energy_200.json data/templates/health_severity_vnext/reading_template.json | tee /tmp/wengua-1930-manual/swift_public_readings.log
          python3 tests/compare_gpt_ios_exact_wording_20261026.py /tmp/wengua-1930-manual/python_truth.json /tmp/wengua-1930-manual/swift_public_readings.log /tmp/wengua-1930-manual/exact_wording_diff.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/wengua-1930-manual")
          case=json.loads((p/"python_truth.json").read_text(encoding="utf8"))["cases"][0]
          ios=[json.loads(s.split("VNEXT_IOS_PYEXACT=",1)[1]) for s in (p/"swift_public_readings.log").read_text(encoding="utf8").splitlines() if "VNEXT_IOS_PYEXACT=" in s]
          assert len(ios)==1
          sw="\n\n".join(x["title"]+"：\n"+x["text"] for x in ios[0]["sections"])
          assert case["python_reading_text"]==sw
          doc="\n".join([
             "# 用户指定四柱、1930年生女性：V6.1 Python／Swift 双端真实断案",
             "",
             "- 原始输入：己丑年、丁丑月、癸末〔规范写法癸未〕日、丙辰时；测1930年老太太。",
             "- 干支对应本次软件时间：2010-02-02 07:00 America/New_York；不是新的随机时辰。",
             "- 年命庚午：仅假定1930立春以后出生；更早出生应重新核为己巳。",
             "- 未提供与求测者关系。借用现有其他长辈 direct_proxy source profile 作为技术性条件候选，不可假定实为亲属、母亲或原书证实用神。",
             "- 以下为术数规则程序模拟，不涉及真实医疗诊断或疗效、病情预后。",
             "",
             "四柱："+"／".join(ios[0]["pillars"])+"；节气："+ios[0]["solar_term"]+"；"+ios[0]["bureau"],
             "",
             "## Python 正式全文",
             case["python_reading_text"],
             "",
             "## iOS Swift 生产 Router 正式全文",
             sw,
             "",
             "## 逐字验收",
             "完整中文 / 结构 ID / 标点 / 段落 / 时间 / 关系一致：True",
          ])+"\n"
          (p/"full_1930_manual_python_swift_reading.md").write_text(doc,encoding="utf8")
          print("MANUAL_1930_FULL_READING_START")
          print(doc)
          print("MANUAL_1930_FULL_READING_END")
          PY
      - name: Archive user supplied four pillar 1930 natal production Swift reading in original repository
