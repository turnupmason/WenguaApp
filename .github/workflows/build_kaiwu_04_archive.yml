name: Archive Kaiwu chapter four directional judgment and timing
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_kaiwu_04_from_03.py'
      - 'sources/kaiwu/开悟之门_第四章.txt'
      - 'schema/migrations/019_kaiwu_analysis_stem_timing.sql'
      - 'tests/test_kaiwu_fourth_part.py'
      - '.github/workflows/build_kaiwu_04_archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'turnupmason/WenguaApp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify entire original and exact 81 ordered pairs, old V1 immutable database
        run: python -m unittest discover -s tests -p test_kaiwu_fourth_part.py -v
      - name: Build next complete book archive only from approved-by-hash prior binary
        run: |
          python -m scripts.build_kaiwu_04_from_03 \
            --base 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门3章_103案例_完整研究库.sqlite3' \
            --source 'sources/kaiwu/开悟之门_第四章.txt' \
            --output 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门4章_103案例_完整研究库.sqlite3' \
            --index-dir 'data/knowledge/kaiwu/analysis_judgment_ch04'
      - name: Generate immutable compressed copy and verify real bytes, SHA, and counts
        run: |
          python - <<'PY'
          import hashlib,json,lzma,sqlite3
          from pathlib import Path
          root=Path('archives/sqlite')
          old=root/'WenguaApp_神奇之门21章_开悟之门3章_103案例_完整研究库.sqlite3'
          new=root/'WenguaApp_神奇之门21章_开悟之门4章_103案例_完整研究库.sqlite3'
          zipped=new.with_suffix('.sqlite3.xz')
          zipped.write_bytes(lzma.compress(new.read_bytes(),preset=6))
          idx=json.loads(Path('data/knowledge/kaiwu/analysis_judgment_ch04/chapter_manifest.json').read_text('utf8'))
          assert idx['baseline_sha256']==hashlib.sha256(old.read_bytes()).hexdigest()
          with sqlite3.connect(new) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           counts={t:db.execute('SELECT count(*) FROM "'+t+'"').fetchone()[0]
                   for t in idx['counts']}
          assert counts==idx['counts']
          m={'schema':'wengua_multibook_additive_source_archive_v4',
           'source_book':'kaiwu','chapter':'第四章 如何分析判断奇门格局',
           'source_sha256':idx['source_sha256'],'source_bytes':idx['source_bytes'],
           'source_lines':idx['source_lines'],
           'total_source_sections':25,'book_counts':{'shenqi':21,'kaiwu':4},
           'new_concept_occurrences':idx['new_semantic_occurrences'],
           'new_ordered_guest_host_stem_pairs':81,'new_timing_methods':sum(idx['timing_method_counts'].values()),
           'new_crossbook_references':idx['new_shenqi_bibliographic_links'],
           'reprinted_case_and_five_element_source_figures':2,
           'new_figure_palace_text_cells':18,
           'historical_cases_unchanged':103,'actual_historical_prediction_charts_unchanged':112,
           'original_historical_palaces_unchanged':1008,'author_steps_unchanged':495,
           'original_six_wrong_initial_predictions_unchanged':True,
           'new_independent_prediction_cases':0,'new_independent_prediction_charts':0,
           'parent_full_archive':str(old),'parent_sha256':hashlib.sha256(old.read_bytes()).hexdigest(),
           'main_archive_path':str(new),'sha256':hashlib.sha256(new.read_bytes()).hexdigest(),
           'size':new.stat().st_size,'compressed_path':str(zipped),
           'compressed_sha256':hashlib.sha256(zipped.read_bytes()).hexdigest(),
           'compressed_size':zipped.stat().st_size,
           'counts':counts,'integrity_check':'ok','foreign_key_violations':0,
           'all_old_rows_preserved':True,'new_positive_training_eligible':0,
           'new_approved_rules':0,'source_is_not_independent_scientific_validation':True,
           'public_complete_archive_user_authorized':True}
          (root/'shenqi21_kaiwu04_103cases_manifest.json').write_text(
             json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print(json.dumps(m,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shenqi21-kaiwu04-full-jurisdictional-rules-and-source
          path: |
            archives/sqlite/WenguaApp_神奇之门21章_开悟之门4章_103案例_完整研究库.sqlite3
            archives/sqlite/WenguaApp_神奇之门21章_开悟之门4章_103案例_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu04_103cases_manifest.json
          retention-days: 30
      - name: Commit new immutable binary version and indexed book source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门4章_103案例_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门4章_103案例_完整研究库.sqlite3.xz' \
                     'archives/sqlite/shenqi21_kaiwu04_103cases_manifest.json' \
                     'data/knowledge/kaiwu/analysis_judgment_ch04/'
          git diff --cached --check
          git commit -m 'Archive Kaiwu chapter four 81 directed stem pairs and historical source preservation'
          git push origin HEAD:main
