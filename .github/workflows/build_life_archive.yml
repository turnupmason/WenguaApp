name: Build and archive twentieth life-opportunity source SQLite
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_shenqi_20_from_19.py'
      - 'sources/shenqi/神奇之门_人生机遇预测_精校完整版(1).txt'
      - 'schema/migrations/015_life_case_phase.sql'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'turnupmason/WenguaApp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Copy the full 19-chapter SQLite and import all five birth/inquiry stories
        run: |
          python scripts/build_shenqi_20_from_19.py \
            --base 'archives/sqlite/WenguaApp_神奇之门_19章_93案例_完整研究库.sqlite3' \
            --source 'sources/shenqi/神奇之门_人生机遇预测_精校完整版(1).txt' \
            --output 'archives/sqlite/WenguaApp_神奇之门_20章_98案例_完整研究库.sqlite3' \
            --index-dir 'data/knowledge/shenqi/life_opportunity_prediction_ch16'
      - name: Compress complete SQLite and produce verifiable manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma,sqlite3
          folder=Path('archives/sqlite')
          base=folder/'WenguaApp_神奇之门_19章_93案例_完整研究库.sqlite3'
          out=folder/'WenguaApp_神奇之门_20章_98案例_完整研究库.sqlite3'
          xz=out.with_suffix(out.suffix+'.xz')
          xz.write_bytes(lzma.compress(out.read_bytes(),preset=6))
          data=json.loads(Path('data/knowledge/shenqi/life_opportunity_prediction_ch16/chapter_manifest.json').read_text('utf8'))
          with sqlite3.connect(out) as con:
           assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert con.execute('PRAGMA foreign_key_check').fetchall()==[]
           assert con.execute('SELECT count(*) FROM historical_life_case_context').fetchone()[0]==5
          m={'schema':'wengua_complete_versioned_sqlite_archive_v6','book':'神奇之门',
            'chapter_count':20,'event_families':98,'actual_source_charts':105,'original_palace_cells':945,
            'original_author_steps':468,'semantic_assertions':1207,
            'source_title':'人生机遇预测','source_sha256':data['source_sha256'],
            'source_bytes':data['source_utf8_bytes'],'source_lines':data['source_lines'],
            'new_whole_events':5,'new_printed_charts':5,'new_author_steps':51,'new_domain_methods':34,
            'baseline_path':str(base),'baseline_sha256':hashlib.sha256(base.read_bytes()).hexdigest(),
            'main_archive_path':str(out),'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
            'size':out.stat().st_size,'compressed_archive_path':str(xz),
            'compressed_sha256':hashlib.sha256(xz.read_bytes()).hexdigest(),
            'compressed_size':xz.stat().st_size,'integrity_check':'ok','foreign_key_violations':0,
            'all_19_previous_source_rows_unchanged':True,'case4_retrospective_known_outcome':True,
            'case5_death_year_book_error_explicit':True,'case3_early_exact_day_retrospective_only':True,
            'complete_human_verified_reasoning_chains':0,'external_life_prediction_verification':False,
            'public_full_archive_by_user_authorization':True}
          (folder/'20chapters_98cases_manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          PY
      - name: Verify five whole stories, timing errors and complete historic integrity
        run: python -m unittest discover -s tests -p test_life_case_import.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: life-20-chapters-complete-sqlite
          path: |
            archives/sqlite/WenguaApp_神奇之门_20章_98案例_完整研究库.sqlite3
            archives/sqlite/WenguaApp_神奇之门_20章_98案例_完整研究库.sqlite3.xz
            archives/sqlite/20chapters_98cases_manifest.json
          retention-days: 30
      - name: Commit full NEW binary SQLite with SHA manifest, keep all older versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_神奇之门_20章_98案例_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_神奇之门_20章_98案例_完整研究库.sqlite3.xz' \
                     'archives/sqlite/20chapters_98cases_manifest.json' \
                     'data/knowledge/shenqi/life_opportunity_prediction_ch16/'
          git diff --cached --check
          git commit -m 'Archive complete 20-chapter 98-case life-opportunity SQLite'
          git push origin HEAD:main
