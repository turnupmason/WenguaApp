name: WenguaApp CI (current V8.0 only)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  v80_current:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Current V8.0 original 5x5 power and 72 cohost rules
        run: python -m unittest discover -s tests -p 'test_health_v79_independent_cohost_matrix_20261027.py' -v
      - name: All eight role complete environments, pairs, triples and palace restrictions
        run: python -m unittest discover -s tests -p 'test_selected_signifier_graph_v80_20261027.py' -v
      - name: Premium iOS result screen source contract
        run: python -m unittest discover -s tests -p 'test_ios_premium_result_ui_20261028.py' -v
      - name: Immersive offline iPhone journey, frozen V8 and role UI contract
        run: python -m unittest discover -s tests -p 'test_ios_immersive_journey_20261028.py' -v
      - name: Health V8.0 branded verdict and ten-grade customer-only copy
        run: python -m unittest discover -s tests -p 'test_ios_health_grade_copy_20261028.py' -v
      - name: Disease-only independent Tianrui/Tianqin 81 source and cohost contract
        run: python -m unittest discover -s tests -p 'test_health_v80_disease_dual_sky_20261028.py' -v
      - name: 2026-10-28 13:44 same-clock self and colleague source audit
        run: python -m unittest discover -s tests -p 'test_health_20261028_1344_two_person_audit.py' -v
      - name: V8 grandparent real roles and 0 verdict
        run: python -m unittest discover -s tests -p 'test_health_v80_grandparents_neutral_20261028.py' -v
      - name: Real 200-grid centered palace and elder-only Qian Kun source contract
        run: python -m unittest discover -s tests -p 'test_ios_palace_source_power_20261028.py' -v
      - name: Mac launch helper shell syntax (display/build only)
        run: bash -n scripts/打开问卦模拟器.command
      - name: Real source/snapshot Important byte integrity
        run: python -m unittest discover -s tests -p 'test_important_mirror_integrity_20261026.py' -v
      - name: Existing database schema and 1080 index smoke
        run: |
          set -euo pipefail
          mkdir -p local
          python -m scripts.init_database --db local/ci.sqlite3
          python -m scripts.generate_states --output local/ci-states.json
