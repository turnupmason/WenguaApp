name: WenguaApp CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deterministic offline-at-runtime astronomical calculation engine
        run: python -m pip install --disable-pip-version-check --only-binary=:all: pyswisseph==2.10.3.2
      - name: Run source-book and ephemeris regression Python tests
        run: python -m unittest discover -s tests -v
      - name: Verify local schema and 1080 state index
        run: |
          python -m scripts.init_database --db local/ci.sqlite3
          python -m scripts.generate_states --output local/ci-states.json
