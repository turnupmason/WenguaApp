name: Archive Kaiwu litigation 4 complete historical source events
on:
  push:
    branches: [main]
    paths:
      - 'sources/kaiwu/开悟之门_官司诉讼预测.txt'
      - 'scripts/build_kaiwu_litigation_from_geography.py'
      - 'schema/migrations/035_kaiwu_litigation_four_source_ocr_panels.sql'
      - 'tests/test_kaiwu_litigation_source_provenance.py'
      - '.github/workflows/build_kaiwu_litigation_archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'turnupmason/WenguaApp'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate exact original 203 lines and zero lost historical cases
        run: python -m unittest discover -s tests -p test_kaiwu_litigation_source_provenance.py -v
      - name: SQLite backup the verified full 175-case parent and add 4 distinct legal cases
        run: |
          python -m scripts.build_kaiwu_litigation_from_geography \
           --base 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门19节_175案例_完整研究库.sqlite3' \
           --source 'sources/kaiwu/开悟之门_官司诉讼预测.txt' \
           --output 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门20节_179案例_完整研究库.sqlite3' \
           --index-dir 'data/knowledge/kaiwu/litigation_prediction_ch02_section10'
      - name: Compress new true binary database and make verified SHA manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma,sqlite3
          root=Path('archives/sqlite')
          old=root/'WenguaApp_神奇之门21章_开悟之门19节_175案例_完整研究库.sqlite3'
          new=root/'WenguaApp_神奇之门21章_开悟之门20节_179案例_完整研究库.sqlite3'
          xz=new.with_suffix('.sqlite3.xz')
          xz.write_bytes(lzma.compress(new.read_bytes(),preset=6))
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          source=json.loads(Path('data/knowledge/kaiwu/litigation_prediction_ch02_section10/chapter_manifest.json').read_text('utf8'))
          assert sha(old)==source['parent_sha256']
          with sqlite3.connect(new) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           counts={t:db.execute('SELECT COUNT(*) FROM "'+t+'"').fetchone()[0] for t in source['counts']}
          assert counts==source['counts']
          assert counts['cases']==179 and counts['historical_chart_cells']==1440
          assert counts['kaiwu_litigation_transcribed_palaces']==36
          output={'schema':'wengua_complete_shenqi21_kaiwu20_litigation_179cases_v1',
           'source_title':source['source_title'],'source_sha256':source['source_sha256'],
           'source_bytes':source['source_bytes'],'source_lines':source['source_lines'],
           'new_independent_legal_events':4,'true_original_verified_new_printed_nine_palaces':0,
           'user_transcribed_uncertain_source_palaces':36,
           'prior_179_certified_original_printed_boards_retained':True,
           'old_complete_database_path':str(old),'old_database_sha256':sha(old),
           'new_full_archive_path':str(new),'sha256':sha(new),'size_bytes':new.stat().st_size,
           'compressed_archive_path':str(xz),'compressed_sha256':sha(xz),'compressed_size_bytes':xz.stat().st_size,
           'book_11_clear_initial_error_events_preserved':True,
           'teacher_timing_critique_not_first_predictions':True,
           'case4_missed_out_of_scope_relative_death_not_litigated_prediction':True,
           'all_old_tables_rows_unchanged':True,'integrity_check':'ok','foreign_key_errors':0,
           'counts':counts,'public_full_archive_user_authorized':True}
          (root/'shenqi21_kaiwu_litigation_179cases_manifest.json').write_text(
            json.dumps(output,ensure_ascii=False,indent=2)+'\n','utf8')
          print(json.dumps(output,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-kaiwu-litigation-179-historical-event-research-db
          path: |
            archives/sqlite/WenguaApp_神奇之门21章_开悟之门20节_179案例_完整研究库.sqlite3
            archives/sqlite/WenguaApp_神奇之门21章_开悟之门20节_179案例_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu_litigation_179cases_manifest.json
          retention-days: 30
      - name: Commit source-index and REAL versioned full SQLite and compressed XZ
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门20节_179案例_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门20节_179案例_完整研究库.sqlite3.xz' \
            'archives/sqlite/shenqi21_kaiwu_litigation_179cases_manifest.json' \
            'data/knowledge/kaiwu/litigation_prediction_ch02_section10/'
          git diff --cached --check
          git commit -m 'Archive full Kaiwu litigation four events and OCR-source cautions into 179-event SQLite'
          git push origin HEAD:main
