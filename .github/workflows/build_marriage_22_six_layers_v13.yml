name: Archive Marriage 22 Scenarios and Global Six Layer Evidence Contract
on:
  push:
    branches: [main]
    paths:
      - 'schema/migrations/041_global_six_layers_marriage22_scenarios.sql'
      - 'scripts/build_marriage_22_six_layers_v13.py'
      - 'src/wengua/six_layer_contract.py'
      - 'data/knowledge/phrase_library/marriage_v1_3/twenty_two_scene_methods.json'
      - 'tests/test_marriage_22_six_layers_v13.py'
      - '.github/workflows/build_marriage_22_six_layers_v13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'turnupmason/WenguaApp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test complete source evidence pipeline and unchanged 194 historical events
        run: python -m unittest discover -s tests -p test_marriage_22_six_layers_v13.py -v
      - name: Append 22 user scenario methods to full 194 historical case V1.2 SQLite
        run: |
          python -m scripts.build_marriage_22_six_layers_v13 \
            --base 'archives/sqlite/WenguaApp_双书194案例_婚姻各类问事流程V1_2_完整研究库.sqlite3' \
            --output 'archives/sqlite/WenguaApp_双书194案例_婚姻22场景六层流程V1_3_完整研究库.sqlite3' \
            --index-dir 'data/knowledge/phrase_library/marriage_v1_3/archive_index'
      - name: Compress versioned full SQLite and verify manifest and counts
        run: |
          python - <<'PY'
          import hashlib,json,lzma,sqlite3
          from pathlib import Path
          root=Path('archives/sqlite')
          old=root/'WenguaApp_双书194案例_婚姻各类问事流程V1_2_完整研究库.sqlite3'
          new=root/'WenguaApp_双书194案例_婚姻22场景六层流程V1_3_完整研究库.sqlite3'
          compressed=new.with_suffix('.sqlite3.xz')
          compressed.write_bytes(lzma.compress(new.read_bytes(),preset=6))
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads(Path('data/knowledge/phrase_library/marriage_v1_3/archive_index/manifest.json').read_text('utf8'))
          assert h(old)==m['parent_full_SQLite_SHA256']
          with sqlite3.connect(new) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           counts={t:db.execute('SELECT COUNT(*) FROM "'+t+'"').fetchone()[0] for t in m['counts']}
          assert counts==m['counts']
          assert counts['cases']==194 and counts['marriage22_scenario_protocol']==22
          assert counts['marriage22_six_layer_steps']==132
          assert counts['phrase_intent_workflows']==9
          manifest={'schema':'wengua_full_two_books_marriage_22_six_layer_v13',
            'parent_archive':str(old),'parent_sha256':h(old),
            'new_complete_SQLite_archive':str(new),'sha256':h(new),
            'size_bytes':new.stat().st_size,
            'compressed_archive':str(compressed),'compressed_sha256':h(compressed),
            'compressed_size_bytes':compressed.stat().st_size,
            'all_historical_194_cases_unchanged':True,
            'old_9_marriage_workflows_unchanged':True,
            'old_four_phrase_drafts_unchanged':True,
            'global_six_layer_contract_enforced':True,
            'marriage_scenes':22,'mandatory_stage_rows':132,
            'exact_book_source_links':m['author_source_line_links_inherited'],
            'completed_real_chart_predictions':0,
            'all_new_user_absolute_assertions_reviewed_not_preapproved':True,
            'no_claim_about_100percent_prediction_accuracy':True,
            'sqlite_integrity_check':'ok','foreign_key_errors':0,
            'counts':counts}
          (root/'shenqi21_kaiwu22_marriage22_six_layer_v13_manifest.json').write_text(
            json.dumps(manifest,ensure_ascii=False,indent=2)+'\n','utf8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marriage-22-six-layers-full-194-case-source-archive
          path: |
            archives/sqlite/WenguaApp_双书194案例_婚姻22场景六层流程V1_3_完整研究库.sqlite3
            archives/sqlite/WenguaApp_双书194案例_婚姻22场景六层流程V1_3_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu22_marriage22_six_layer_v13_manifest.json
          retention-days: 30
      - name: Git commit full SQLite, XZ, source manifest and scenario index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_双书194案例_婚姻22场景六层流程V1_3_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_双书194案例_婚姻22场景六层流程V1_3_完整研究库.sqlite3.xz' \
            'archives/sqlite/shenqi21_kaiwu22_marriage22_six_layer_v13_manifest.json' \
            'data/knowledge/phrase_library/marriage_v1_3/archive_index/'
          git diff --cached --check
          git commit -m 'Archive full 194-case two-book SQLite with 22 marriage six-layer evidence protocols'
          git push origin HEAD:main
