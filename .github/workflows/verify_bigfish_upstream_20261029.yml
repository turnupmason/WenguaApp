name: BigFish upstream 1080 structural audit (no frozen V8 change)
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/verify_bigfish_upstream_1080_20261029.cjs
      - scripts/bigfish_shijia_cast_bridge_20261029.cjs
      - scripts/verify_bigfish_frozen_v8_samples_20261029.py
      - scripts/verify_bigfish_actor_natal_real_20261029.py
      - scripts/verify_bigfish_first_supported_20_20261029.py
      - scripts/verify_bigfish_real_calendar_window_20261031.py
      - scripts/verify_bigfish_all_actor_signifiers_20261031.py
      - scripts/wengua_bigfish_518400_offline_editorial_20261029.py
      - .github/workflows/verify_bigfish_upstream_20261029.yml
jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin actual upstream original TypeScript
        run: |
          git clone https://github.com/perfhelf/bigfishmarquis-qimen.git /tmp/bigfish
          git -C /tmp/bigfish checkout --detach 6112b3937d7fcaa2ab0a34aec2a52f74e2effe6c
          test "$(git -C /tmp/bigfish rev-parse HEAD)" = 6112b3937d7fcaa2ab0a34aec2a52f74e2effe6c
      - name: Compile TypeScript source without rewriting it
        run: |
          mkdir -p /tmp/bigfish-toolchain /tmp/bigfish-dist
          npm --prefix /tmp/bigfish-toolchain install --no-save --save-exact typescript@5.8.3
          /tmp/bigfish-toolchain/node_modules/.bin/tsc --module commonjs --target es2020 --moduleResolution node --lib es2020,dom --skipLibCheck --rootDir /tmp/bigfish/src --outDir /tmp/bigfish-dist /tmp/bigfish/src/engines/shijia.ts /tmp/bigfish/src/engines/chaibuquju.ts /tmp/bigfish/src/engines/maoshan.ts /tmp/bigfish/src/engines/zhirun.ts
      - name: Real 1080 generated charts structural checks
        run: |
          node scripts/verify_bigfish_upstream_1080_20261029.cjs /tmp/bigfish-dist | tee /tmp/bigfish-1080.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Two real-clock BigFish casting to frozen V8/V10.2 (separate audit)
        run: |
          set -o pipefail
          python -m scripts.verify_bigfish_frozen_v8_samples_20261029 --compiled /tmp/bigfish-dist | tee /tmp/bigfish-real-v8.jsonl
      - name: Real BigFish four actor + natal branches through frozen V8/V10.2
        run: |
          set -o pipefail
          python -m scripts.verify_bigfish_actor_natal_real_20261029 --compiled /tmp/bigfish-dist | tee /tmp/bigfish-actor-natal-real.jsonl
      - name: First real 20 father non-Jia Year pair branches after old 1100 retained failures
        run: |
          set -o pipefail
          python -m scripts.verify_bigfish_first_supported_20_20261029 --compiled /tmp/bigfish-dist | tee /tmp/bigfish-first-supported-20.jsonl
      - name: REAL Gregorian Nov15-Mar15 six source casts BigFish TS through V8/V10.2
        run: |
          set -o pipefail
          python -m scripts.verify_bigfish_real_calendar_window_20261031 --compiled /tmp/bigfish-dist | tee /tmp/bigfish-true-calendar-2026-2027.jsonl
      - name: All 22 original actor sources and 24 conditional real BigFish V8 readings
        run: |
          set -o pipefail
          python -m scripts.verify_bigfish_all_actor_signifiers_20261031 --compiled /tmp/bigfish-dist | tee /tmp/bigfish-all-24-actor-source.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigfish-original-ts-1080-structural-results
          path: |
            /tmp/bigfish-1080.json
            /tmp/bigfish-real-v8.jsonl
            /tmp/bigfish-actor-natal-real.jsonl
            /tmp/bigfish-first-supported-20.jsonl
            /tmp/bigfish-true-calendar-2026-2027.jsonl
            /tmp/bigfish-all-24-actor-source.jsonl
          if-no-files-found: ignore
