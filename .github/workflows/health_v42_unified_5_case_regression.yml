name: V4.2 Unified V3.9 and Full12 Six-Budget Tests
on:
  push:
    branches: [main]
    paths:
      - 'data/knowledge/score_models/health_severity_v42/**'
      - 'src/wengua/health_severity_v42_integrated.py'
      - 'scripts/replay_health_v42_unified_five_actual_casts.py'
      - 'tests/test_health_v42_unified_full12_5cases.py'
      - '.github/workflows/health_v42_unified_5_case_regression.yml'
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check 120 original book stage anchors, preserved V3.9 text and five true source first-question casts
        run: |
          python -m unittest discover -s tests -p test_health_v42_unified_full12_5cases.py -v
          python -m scripts.replay_health_v42_unified_five_actual_casts
