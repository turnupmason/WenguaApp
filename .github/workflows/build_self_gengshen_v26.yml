name: V2.6 Strict Gengshen Self Health Template and Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/wengua/health_severity_v26.py'
      - 'data/knowledge/phrase_library/health_v26/**'
      - 'scripts/run_self_gengshen_v26.py'
      - 'tests/test_health_severity_strict_v26.py'
      - 'scripts/build_health_strict_v26_archive.py'
      - 'schema/migrations/054_health_severity_strict_customer_template_v26.sql'
      - '.github/workflows/build_self_gengshen_v26.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  offline_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Real four-pillar self reading, Fuyin/Fanyin and source-backed verdict
        run: python -m unittest discover -s tests -p test_health_severity_strict_v26.py -v
  archive:
    runs-on: ubuntu-latest
    needs: offline_test
    if: github.repository == 'turnupmason/WenguaApp'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check immutable archive prior to build
        id: archive_guard
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('archives/sqlite')
          f=d/'WenguaApp_双书194案例_庚申时本人病情精简模板纠错V2_6_完整研究库.sqlite3'
          m=d/'shenqi21_kaiwu22_self_health_strict_v26_manifest.json'
          if f.exists():
           assert m.is_file()
           assert hashlib.sha256(f.read_bytes()).hexdigest()==json.loads(m.read_text('utf8'))['sha256']
          PY
          if [ -f 'archives/sqlite/WenguaApp_双书194案例_庚申时本人病情精简模板纠错V2_6_完整研究库.sqlite3' ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build full versioned 194-case SQLite from exact V2.4
        if: steps.archive_guard.outputs.exists == 'false'
        run: |
          python -m scripts.build_health_strict_v26_archive \
            --base 'archives/sqlite/WenguaApp_双书194案例_本人庚申时病情轻重伏吟反吟V2_5_完整研究库.sqlite3' \
            --output 'archives/sqlite/WenguaApp_双书194案例_庚申时本人病情精简模板纠错V2_6_完整研究库.sqlite3' \
            --index-dir 'data/knowledge/phrase_library/health_v26/archive_index'
      - name: XZ, SHA, row-count, SQLite integrity receipt
        if: steps.archive_guard.outputs.exists == 'false'
        run: |
          python - <<'PY'
          import hashlib,json,lzma,sqlite3
          from pathlib import Path
          d=Path('archives/sqlite')
          base=d/'WenguaApp_双书194案例_本人庚申时病情轻重伏吟反吟V2_5_完整研究库.sqlite3'
          db=d/'WenguaApp_双书194案例_庚申时本人病情精简模板纠错V2_6_完整研究库.sqlite3'
          xz=Path(str(db)+'.xz')
          xz.write_bytes(lzma.compress(db.read_bytes(),preset=6))
          sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          content=json.loads(Path('data/knowledge/phrase_library/health_v26/archive_index/manifest.json').read_text('utf8'))
          assert content['parent_sha256']==sha(base)
          assert content['new_sha256']==sha(db)
          with sqlite3.connect(db) as con:
           assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert con.execute('PRAGMA foreign_key_check').fetchall()==[]
           assert con.execute('SELECT COUNT(*) FROM cases').fetchone()[0]==194
           assert con.execute('SELECT COUNT(*) FROM health_v22_customer_severity_sections').fetchone()[0]==21
           assert con.execute('SELECT COUNT(*) FROM health_v26_strict_customer_template').fetchone()[0]==11
           assert con.execute('SELECT COUNT(*) FROM marriage_v16_post_inference_labels WHERE matches_initial_book_retrospective_result=0').fetchone()[0]==2
          receipt={
           'schema':'wengua_v25_11_health_source_offline_full_archive',
           'sha256':sha(db),'size_bytes':db.stat().st_size,'file':str(db),
           'xz_sha256':sha(xz),'xz_size_bytes':xz.stat().st_size,
           'parent_sha256':sha(base),'old_cases':194,'old_sections':43,
           'previous_failed_development_cases':2,'underlying_source_facts':21,
           'template_sections':11,'this_self_case_visible_sections':10,
           'star_door_fuyin_fanyin_separate':True,
           'traditional_binary_only_not_medical':True,
           'runtime_gpt':False,'user_content_approval':'pending',
           'four_other_health_intents_approval':'unapproved',
           'integrity_check':'ok'}
          (d/'shenqi21_kaiwu22_self_health_strict_v26_manifest.json').write_text(
           json.dumps(receipt,ensure_ascii=False,indent=2)+'\n','utf8')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.archive_guard.outputs.exists == 'false'
        with:
          name: wengua-gengshen-self-health-v26-strict-full194
          retention-days: 30
          path: |
            archives/sqlite/WenguaApp_双书194案例_庚申时本人病情精简模板纠错V2_6_完整研究库.sqlite3
            archives/sqlite/WenguaApp_双书194案例_庚申时本人病情精简模板纠错V2_6_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu22_self_health_strict_v26_manifest.json
      - name: Commit new immutable archive only, no updates to previous archives
        if: steps.archive_guard.outputs.exists == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_双书194案例_庚申时本人病情精简模板纠错V2_6_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_双书194案例_庚申时本人病情精简模板纠错V2_6_完整研究库.sqlite3.xz' \
            'archives/sqlite/shenqi21_kaiwu22_self_health_strict_v26_manifest.json' \
            'data/knowledge/phrase_library/health_v26/archive_index/'
          git diff --cached --check
          git commit -m 'Archive V2.6 full 194-case source with Gengshen self-health Fuyin verdict'
          git push origin HEAD:main
