name: Archive Marriage V1.4 Deterministic Source Casting Runtime Bridge
on:
  push:
    branches: [main]
    paths:
      - 'schema/migrations/042_marriage_source_cast_runtime_bridge.sql'
      - 'scripts/build_marriage_runtime_v14.py'
      - '.github/workflows/build_marriage_runtime_v14.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'turnupmason/WenguaApp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate original chapter one nine palaces and real runtime source retrieval tests
        run: |
          python -m unittest discover -s tests -p test_casting_shenqi_chapter01.py -v
          python -m unittest discover -s tests -p test_marriage_runtime_source_cast_v14.py -v
          python -m unittest discover -s tests -p test_marriage_runtime_v14_archive.py -v
      - name: Validate frozen immutable V1.4 binary SHA against original signed manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,sqlite3
          root=Path('archives/sqlite')
          old=root/'WenguaApp_双书194案例_婚姻真实排盘接入V1_4_完整研究库.sqlite3'
          archive=root/'shenqi21_kaiwu22_marriage_source_cast_runtime_v1_4_manifest.json'
          original=Path('data/knowledge/phrase_library/marriage_v1_4/source_cast_studies/manifest.json')
          result=json.loads(archive.read_text('utf8'))
          source=json.loads(original.read_text('utf8'))
          checksum=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          assert checksum(old)==result['sha256']==source['new_complete_SQLite_SHA256'], 'Never rewrite archived V1.4'
          with sqlite3.connect(old) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           assert db.execute('SELECT COUNT(*) FROM cases').fetchone()[0]==194
           assert db.execute('SELECT COUNT(*) FROM marriage_runtime_scenario_study').fetchone()[0]==44
          print('V1.4 source archive frozen at',result['sha256'])
          PY
      - name: Compress new full SQLite and confirm parent SHA, 44 studies and no synthetic forecasts
        run: |
          python - <<'PY'
          import hashlib,json,lzma,sqlite3
          from pathlib import Path
          root=Path('archives/sqlite')
          parent=root/'WenguaApp_双书194案例_婚姻22场景六层流程V1_3_完整研究库.sqlite3'
          new=root/'WenguaApp_双书194案例_婚姻真实排盘接入V1_4_完整研究库.sqlite3'
          xz=new.with_suffix('.sqlite3.xz')
          xz.write_bytes(lzma.compress(new.read_bytes(),preset=6))
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          data=json.loads(Path('data/knowledge/phrase_library/marriage_v1_4/source_cast_studies/manifest.json').read_text('utf8'))
          assert h(parent)==data['full_parent_SQLite_SHA256']
          with sqlite3.connect(new) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           counts={t:db.execute('SELECT COUNT(*) FROM "'+t+'"').fetchone()[0] for t in data['counts']}
          assert counts==data['counts']
          assert counts['cases']==194 and counts['marriage_runtime_scenario_study']==44
          assert counts['phrase_context_instances']==0 and counts['marriage_runtime_source_cast_fixture']==2
          manifest={'schema':'wengua_full_marriage_source_chart_runtime_v1_4',
           'parent_complete_sqlite':str(parent),'parent_sha256':h(parent),
           'latest_complete_sqlite':str(new),'sha256':h(new),
           'size_bytes':new.stat().st_size,
           'compressed_archive':str(xz),'compressed_sha256':h(xz),
           'compressed_size_bytes':xz.stat().st_size,
           'book_cases_total':194,'original_book_sections_total':43,
           'user_scene_count':22,'source_caster_example_charts':2,
           'source_caster_example_palaces':18,'study_scene_chart_pipelines':44,
           'new_real_marriage_inquiries':0,
           'new_book_claims_of_correct_predicted_dates':0,
           'published_complete_marriage_predictions':0,
           'old_complete_source_rows_unchanged':True,
           'sqlite_integrity_check':'ok','foreign_key_errors':0,
           'counts':counts}
          (root/'shenqi21_kaiwu22_marriage_source_cast_runtime_v1_4_manifest.json').write_text(
           json.dumps(manifest,ensure_ascii=False,indent=2)+'\n','utf8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marriage-v14-source-cast-runtime-full-194-case-sqlite
          path: |
            archives/sqlite/WenguaApp_双书194案例_婚姻真实排盘接入V1_4_完整研究库.sqlite3
            archives/sqlite/WenguaApp_双书194案例_婚姻真实排盘接入V1_4_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu22_marriage_source_cast_runtime_v1_4_manifest.json
          retention-days: 30
      - name: Commit full immutable V1.4 binary archive and exact source regression manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_双书194案例_婚姻真实排盘接入V1_4_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_双书194案例_婚姻真实排盘接入V1_4_完整研究库.sqlite3.xz' \
            'archives/sqlite/shenqi21_kaiwu22_marriage_source_cast_runtime_v1_4_manifest.json' \
            'data/knowledge/phrase_library/marriage_v1_4/source_cast_studies/'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Immutable V1.4 archive already committed; SHA-replay matches; no new commit needed.'
          else
            git commit -m 'Archive true book-source nine-palace runtime tests across marriage 22 scene intents'
            git push origin HEAD:main
          fi
