name: Archive Kaiwu competition evaluation 2 cases and 3 flat OCR casts
on:
  push:
    branches: [main]
    paths:
      - 'sources/kaiwu/开悟之门_竞争评比预测.txt'
      - 'scripts/build_kaiwu_competition_from_litigation.py'
      - 'schema/migrations/036_kaiwu_competition_multicast_unprinted.sql'
      - 'tests/test_kaiwu_competition_multicast.py'
      - '.github/workflows/build_kaiwu_competition_archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'turnupmason/WenguaApp'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test source exact SHA, 179-case previous database and original cast absences
        run: python -m unittest discover -s tests -p test_kaiwu_competition_multicast.py -v
      - name: Append 2 unique events and 3 OCR witnesses to 179-event full source DB
        run: |
          python -m scripts.build_kaiwu_competition_from_litigation \
            --base 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门20节_179案例_完整研究库.sqlite3' \
            --source 'sources/kaiwu/开悟之门_竞争评比预测.txt' \
            --output 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门21节_181案例_完整研究库.sqlite3' \
            --index-dir 'data/knowledge/kaiwu/competition_evaluation_ch02_section12'
      - name: Generate exact SHA and XZ of the newly built complete 181-event archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma,sqlite3
          root=Path('archives/sqlite')
          old=root/'WenguaApp_神奇之门21章_开悟之门20节_179案例_完整研究库.sqlite3'
          new=root/'WenguaApp_神奇之门21章_开悟之门21节_181案例_完整研究库.sqlite3'
          xz=new.with_suffix('.sqlite3.xz')
          xz.write_bytes(lzma.compress(new.read_bytes(),preset=6))
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          meta=json.loads(Path('data/knowledge/kaiwu/competition_evaluation_ch02_section12/chapter_manifest.json').read_text('utf8'))
          assert h(old)==meta['parent_sha256']
          with sqlite3.connect(new) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           counts={k:db.execute('SELECT COUNT(*) FROM "'+k+'"').fetchone()[0] for k in meta['counts']}
          assert counts==meta['counts']
          assert counts['cases']==181 and counts['historical_chart_cells']==1440
          m={'schema':'wengua_shenqi21_kaiwu21_competition_181_full_v1',
           'source_title':meta['source_title'],'source_sha256':meta['source_sha256'],
           'source_bytes':meta['source_bytes'],'source_lines':meta['source_lines'],
           'two_source_whole_events':2,'three_OCR_printed_raw_fragments':3,
           'one_missing_original_cast_date_unknown':True,
           'new_verified_original_spatial_nine_palace_casts':0,
           'first_case_three_cast_mentions_one_family':True,
           'second_case_two_distinct_group_winners':True,
           'old_179_complete_charts_untouched':True,'eleven_explicit_old_error_events_retained':True,
           'old_full_db_path':str(old),'old_full_db_sha256':h(old),
           'new_full_db_path':str(new),'sha256':h(new),'size_bytes':new.stat().st_size,
           'compressed_archive_path':str(xz),'compressed_sha256':h(xz),'compressed_size_bytes':xz.stat().st_size,
           'all_old_rows_unchanged':True,'integrity_check':'ok','foreign_key_errors':0,
           'counts':counts,'public_full_archive_user_authorized':True}
          (root/'shenqi21_kaiwu_competition_181cases_manifest.json').write_text(
            json.dumps(m,ensure_ascii=False,indent=2)+'\n','utf8')
          print(json.dumps(m,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-181-source-events-competition-sqlite-and-xz
          path: |
            archives/sqlite/WenguaApp_神奇之门21章_开悟之门21节_181案例_完整研究库.sqlite3
            archives/sqlite/WenguaApp_神奇之门21章_开悟之门21节_181案例_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu_competition_181cases_manifest.json
          retention-days: 30
      - name: Commit actual full binary archive, compressed file and source anchor indices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门21节_181案例_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门21节_181案例_完整研究库.sqlite3.xz' \
                     'archives/sqlite/shenqi21_kaiwu_competition_181cases_manifest.json' \
                     'data/knowledge/kaiwu/competition_evaluation_ch02_section12/'
          git diff --cached --check
          git commit -m 'Archive Kaiwu competition two events and multicaste source witnesses into full 181-event DB'
          git push origin HEAD:main
