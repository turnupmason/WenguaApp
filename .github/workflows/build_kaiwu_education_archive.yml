name: Archive Kaiwu exam cases in shared Shenqi education domain
on:
  push:
    branches: [main]
    paths:
      - 'sources/kaiwu/开悟之门_求学考试预测.txt'
      - 'scripts/build_kaiwu_education_from_employment.py'
      - 'schema/migrations/025_kaiwu_education_shared_domain.sql'
      - 'tests/test_kaiwu_education_unified_domain.py'
      - '.github/workflows/build_kaiwu_education_archive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'turnupmason/WenguaApp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check 3 source events 3 printed panels 4 student outcome records 2 partial school-direction misses
        run: python -m unittest discover -s tests -p test_kaiwu_education_unified_domain.py -v
      - name: Build next full immutable SQLite only via SHA-pinned prior 130-case archive
        run: |
          python -m scripts.build_kaiwu_education_from_employment \
            --base 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门9节_130案例_完整研究库.sqlite3' \
            --source 'sources/kaiwu/开悟之门_求学考试预测.txt' \
            --output 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门10节_133案例_完整研究库.sqlite3' \
            --index-dir 'data/knowledge/kaiwu/education_prediction_ch02_section03'
      - name: Compress genuine binary, verify parent SHA and final chapter/claim counts
        run: |
          python - <<'PY'
          import hashlib,json,lzma,sqlite3
          from pathlib import Path
          root=Path('archives/sqlite')
          parent=root/'WenguaApp_神奇之门21章_开悟之门9节_130案例_完整研究库.sqlite3'
          new=root/'WenguaApp_神奇之门21章_开悟之门10节_133案例_完整研究库.sqlite3'
          xz=new.with_suffix('.sqlite3.xz')
          xz.write_bytes(lzma.compress(new.read_bytes(),preset=6))
          data=json.loads(Path('data/knowledge/kaiwu/education_prediction_ch02_section03/chapter_manifest.json').read_text('utf-8'))
          assert hashlib.sha256(parent.read_bytes()).hexdigest()==data['parent_sha256']
          with sqlite3.connect(new) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           counts={name:db.execute('SELECT COUNT(*) FROM "'+name+'"').fetchone()[0] for name in data['counts']}
          assert counts==data['counts']
          assert counts['cases']==133
          assert counts['education_crossbook_source_casts']==3
          assert counts['education_crossbook_source_palaces']==27
          assert counts['education_crossbook_candidates']==4
          assert counts['education_crossbook_book_claims']==6
          result={'schema':'wengua_kaiwu_education_three_events_four_students_full_archive',
           'source_title':data['source_title'],'source_sha256':data['source_sha256'],
           'source_bytes':data['source_bytes'],'source_lines':data['source_lines'],
           'total_source_sections':31,'book_counts':data['book_counts'],
           'new_cases_accepted_without_individual_user_review':3,
           'new_event_families':3,'new_original_printed_casts':3,
           'new_raw_palace_cells':27,'new_source_reasoning_groups':9,
           'new_student_outcomes':4,'sisters_share_one_historical_cast':True,
           'old_shenqi_dai_son_only_reference_not_duplicate':True,
           'book_explicit_partial_directional_misses':2,
           'all_prior_eight_case_level_explicit_errors_unchanged':True,
           'total_event_families':133,'total_real_original_qimen_casts':149,
           'prior_complete_archive_path':str(parent),
           'prior_complete_archive_sha256':hashlib.sha256(parent.read_bytes()).hexdigest(),
           'new_complete_archive_path':str(new),
           'sha256':hashlib.sha256(new.read_bytes()).hexdigest(),
           'size_bytes':new.stat().st_size,
           'compressed_archive_path':str(xz),
           'compressed_sha256':hashlib.sha256(xz.read_bytes()).hexdigest(),
           'compressed_size_bytes':xz.stat().st_size,
           'counts':counts,'integrity_check':'ok','foreign_key_violations':0,
           'all_old_source_rows_unchanged':True,
           'user_book_case_acceptance_not_external_scientific_verification':True,
           'public_complete_archive_user_authorized':True}
          (root/'shenqi21_kaiwu_education_133cases_manifest.json').write_text(
           json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-shenqi21-kaiwu-education-133-event-archive
          path: |
            archives/sqlite/WenguaApp_神奇之门21章_开悟之门10节_133案例_完整研究库.sqlite3
            archives/sqlite/WenguaApp_神奇之门21章_开悟之门10节_133案例_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu_education_133cases_manifest.json
          retention-days: 30
      - name: Commit genuinely built new complete SQLite XZ and user-supplied book evidence indices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门10节_133案例_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_神奇之门21章_开悟之门10节_133案例_完整研究库.sqlite3.xz' \
                     'archives/sqlite/shenqi21_kaiwu_education_133cases_manifest.json' \
                     'data/knowledge/kaiwu/education_prediction_ch02_section03/'
          git diff --cached --check
          git commit -m 'Archive Kaiwu three exam event families four candidate outcomes and partial direction errors'
          git push origin HEAD:main
