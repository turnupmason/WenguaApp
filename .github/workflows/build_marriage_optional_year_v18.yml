name: Archive Marriage V1.8 Optional Birth-Year Author Methods
on:
  push:
    branches: [main]
    paths:
      - 'src/wengua/marriage_no_year_v18.py'
      - 'tests/test_marriage_no_year_v18.py'
      - 'scripts/build_marriage_optional_year_v18.py'
      - 'tests/test_marriage_optional_year_v18_archive.py'
      - 'schema/migrations/046_marriage_optional_nianming_v18.sql'
      - '.github/workflows/build_marriage_optional_year_v18.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify birth-year optional source rules in all 22 scenes
        run: |
          python -m unittest discover -s tests -p test_marriage_no_year_v18.py -v
          python -m unittest discover -s tests -p test_marriage_optional_year_v18_archive.py -v
  archive:
    runs-on: ubuntu-latest
    if: github.repository == 'turnupmason/WenguaApp'
    needs: regression
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Append verified original book optional-year methods to the actual complete 194-event V1.7 source database
        run: |
          python -m scripts.build_marriage_optional_year_v18 \
            --base 'archives/sqlite/WenguaApp_双书194案例_婚姻多证据条件与新增家族验证V1_7_完整研究库.sqlite3' \
            --output 'archives/sqlite/WenguaApp_双书194案例_婚姻无年命作者取用方法V1_8_完整研究库.sqlite3' \
            --index-dir 'data/knowledge/phrase_library/marriage_v1_8/source_provenance'
      - name: Compress full SQLite and independently check all old two-book source cases and previously wrong decisions
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma,sqlite3
          p=Path('archives/sqlite')
          old=p/'WenguaApp_双书194案例_婚姻多证据条件与新增家族验证V1_7_完整研究库.sqlite3'
          new=p/'WenguaApp_双书194案例_婚姻无年命作者取用方法V1_8_完整研究库.sqlite3'
          xz=new.with_suffix('.sqlite3.xz')
          xz.write_bytes(lzma.compress(new.read_bytes(),preset=6))
          checksum=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          r=json.loads(Path('data/knowledge/phrase_library/marriage_v1_8/source_provenance/manifest.json').read_text('utf8'))
          assert checksum(old)==r['parent_full_sqlite_sha256']
          with sqlite3.connect(new) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           counts={k:db.execute('SELECT COUNT(*) FROM "'+k+'"').fetchone()[0] for k in r['counts']}
           wrong=db.execute("""SELECT COUNT(*) FROM marriage_v16_post_inference_labels
             WHERE matches_initial_book_retrospective_result=0""").fetchone()[0]
          assert counts==r['counts']
          assert wrong==2 and counts['cases']==194
          assert counts['marriage_v18_optional_year_scene_methods']==22
          manifest={
           'schema':'wengua_marriage_optional_nianming_v18_complete_194_historical_cases',
           'parent_archive':str(old),'parent_sha256':checksum(old),
           'latest_full_sqlite':str(new),'sha256':checksum(new),
           'size_bytes':new.stat().st_size,
           'compressed_sqlite':str(xz),'compressed_sha256':checksum(xz),
           'compressed_size_bytes':xz.stat().st_size,
           'all_original_194_book_cases_unchanged':True,
           'previous_v16_wrong_dev_answers_unchanged':2,
           'prior_v17_book_method_rules_retained':27,
           'no_birth_year_allowed_all_marriage_scenes':22,
           'original_source_line_sha_records':10,
           'new_real_world_verified_predictions':0,
           'all_historical_rows_preserved':True,
           'integrity_check':'ok','foreign_key_errors':0,'counts':counts}
          (p/'shenqi21_kaiwu22_marriage_optional_nianming_v18_manifest.json').write_text(
           json.dumps(manifest,ensure_ascii=False,indent=2)+'\n','utf8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marriage-optional-nianming-v18-full-194-cases
          path: |
            archives/sqlite/WenguaApp_双书194案例_婚姻无年命作者取用方法V1_8_完整研究库.sqlite3
            archives/sqlite/WenguaApp_双书194案例_婚姻无年命作者取用方法V1_8_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu22_marriage_optional_nianming_v18_manifest.json
          retention-days: 30
      - name: Push versioned entire SQL binary, XZ and exact SHA/error provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_双书194案例_婚姻无年命作者取用方法V1_8_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_双书194案例_婚姻无年命作者取用方法V1_8_完整研究库.sqlite3.xz' \
            'archives/sqlite/shenqi21_kaiwu22_marriage_optional_nianming_v18_manifest.json' \
            'data/knowledge/phrase_library/marriage_v1_8/source_provenance/'
          git diff --cached --check
          git commit -m 'Archive full 194-case SQLite with no-year author marriage inference and all old errors intact'
          git push origin HEAD:main
