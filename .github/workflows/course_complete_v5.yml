name: Two-book complete curriculum v5 and Windows delivery
on:
  push:
    branches: [main]
    paths:
      - '*course*v5*'
      - 'src/wengua/course_*v5.py'
      - 'scripts/*course*v5*'
      - 'tests/test_course_complete_v5.py'
      - 'configs/course_v5*'
      - 'data/knowledge/course_v5/**'
      - 'data/delivery/course_v5/**'
      - '.github/workflows/course_complete_v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-stdlib:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -X utf8 -m unittest tests.test_course_complete_v5 -v
      - run: python -X utf8 -m scripts.check_course_v5_windows
      - run: python -X utf8 run_course_v5.py plan
      - shell: pwsh
        run: |
          cmd /c train_wengua_v5.cmd
          if ($LASTEXITCODE -ne 2) { throw "Missing training environment must stop safely" }
          exit 0
  tiny-cpu-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1
      - run: python -m scripts.check_course_v5_training
      - uses: actions/upload-artifact@v4
        with:
          name: v5-real-tiny-cpu-not-cuda
          path: local/course_v5/tiny_integration.json
