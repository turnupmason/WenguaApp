name: Archive Marriage Nine Intent Workflows in Full 194-Case SQLite
on:
  push:
    branches: [main]
    paths:
      - 'data/knowledge/phrase_library/marriage_v1_2/intent_workflows.json'
      - 'schema/migrations/040_marriage_intent_workflow_sources.sql'
      - 'scripts/build_marriage_intent_workflows_v12.py'
      - 'tests/test_marriage_intent_workflows_v12.py'
      - '.github/workflows/build_marriage_intent_workflows_v12.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.repository == 'turnupmason/WenguaApp'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Source-exact nine intent workflows and full V1.1 parent row regression
        run: python -m unittest discover -s tests -p test_marriage_intent_workflows_v12.py -v
      - name: Build nine source-linked marriage intent methods as an append-only complete SQLite
        run: |
          python -m scripts.build_marriage_intent_workflows_v12 \
            --base 'archives/sqlite/WenguaApp_双书194案例_婚姻断语V1_1_应期强制_完整研究库.sqlite3' \
            --output 'archives/sqlite/WenguaApp_双书194案例_婚姻各类问事流程V1_2_完整研究库.sqlite3' \
            --index-dir 'data/knowledge/phrase_library/marriage_v1_2/archive_index'
      - name: Compress full SQLite and archive manifest with original SHA checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma,sqlite3
          root=Path('archives/sqlite')
          parent=root/'WenguaApp_双书194案例_婚姻断语V1_1_应期强制_完整研究库.sqlite3'
          new=root/'WenguaApp_双书194案例_婚姻各类问事流程V1_2_完整研究库.sqlite3'
          xz=new.with_suffix('.sqlite3.xz')
          xz.write_bytes(lzma.compress(new.read_bytes(),preset=6))
          h=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          info=json.loads(Path('data/knowledge/phrase_library/marriage_v1_2/archive_index/manifest.json').read_text('utf8'))
          assert h(parent)==info['parent_complete_sqlite_sha256']
          with sqlite3.connect(new) as db:
           assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
           cnt={t:db.execute('SELECT COUNT(*) FROM "'+t+'"').fetchone()[0] for t in info['counts']}
          assert cnt==info['counts']
          assert cnt['cases']==194 and cnt['phrase_intent_workflows']==9 and cnt['phrase_intent_evidence_links']==30
          mf={'schema':'wengua_marriage_nine_intent_workflow_source_full_194_v1_2',
           'full_parent':str(parent),'parent_sha256':h(parent),
           'new_full_sqlite':str(new),'sha256':h(new),
           'size_bytes':new.stat().st_size,
           'compressed_archive':str(xz),'compressed_sha256':h(xz),
           'compressed_size_bytes':xz.stat().st_size,
           'full_historical_cases_preserved':194,
           'prior_4_draft_phrases_preserved':True,
           'marriage_question_workflows':9,'method_steps':72,
           'verbatim_book_source_links':30,'actual_verified_reading_instances':0,
           'all_old_rows_unchanged':True,'integrity_check':'ok',
           'foreign_key_errors':0,'counts':cnt,
           'public_full_archive_user_authorized':True}
          (root/'shenqi21_kaiwu22_marriage_intent_workflow_v1_2_manifest.json').write_text(
           json.dumps(mf,ensure_ascii=False,indent=2)+'\n','utf8')
          print(json.dumps(mf,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marriage-question-workflows-full-194-book-cases-v12
          path: |
            archives/sqlite/WenguaApp_双书194案例_婚姻各类问事流程V1_2_完整研究库.sqlite3
            archives/sqlite/WenguaApp_双书194案例_婚姻各类问事流程V1_2_完整研究库.sqlite3.xz
            archives/sqlite/shenqi21_kaiwu22_marriage_intent_workflow_v1_2_manifest.json
          retention-days: 30
      - name: Commit actual binary SQLite XZ, manifest and source-index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- 'archives/sqlite/WenguaApp_双书194案例_婚姻各类问事流程V1_2_完整研究库.sqlite3'
          git add -- 'archives/sqlite/WenguaApp_双书194案例_婚姻各类问事流程V1_2_完整研究库.sqlite3.xz' \
             'archives/sqlite/shenqi21_kaiwu22_marriage_intent_workflow_v1_2_manifest.json' \
             'data/knowledge/phrase_library/marriage_v1_2/archive_index/'
          git diff --cached --check
          git commit -m 'Archive full 194-book-case SQLite with marriage nine question-specific source workflows'
          git push origin HEAD:main
