name: Qwen14B and 32B source research and tiny CPU adapter contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/wengua/qwen_*.py'
      - 'src/wengua/qwen8b_*.py'
      - 'scripts/qwen8b_research.py'
      - 'scripts/check_qwen8b_training.py'
      - 'scripts/check_qwen8b_loss_path.py'
      - 'tests/test_qwen8b_book_v1.py'
      - 'run_qwen8b_research.py'
      - 'run_qwen8b_worker.py'
      - 'run_qwen8b_research_windows.cmd'
      - 'configs/qwen8b_book*.json'
      - 'scripts/qwen_research.py'
      - 'scripts/check_qwen_training.py'
      - 'scripts/qwen_curriculum.py'
      - 'scripts/check_qwen_curriculum_training.py'
      - 'run_qwen_curriculum.py'
      - 'run_qwen_overnight.py'
      - 'run_qwen_book_loop.py'
      - 'run_qwen_book_sweep.py'
      - 'run_qwen_book_sweep_v2.py'
      - 'run_qwen_book_worker.py'
      - 'scripts/check_qwen_book_isolated_training.py'
      - 'run_book_research_v2_windows.cmd'
      - 'configs/qwen14b_book_sweep_v2.json'
      - 'scripts/qwen_book_sweep_v2.py'
      - 'scripts/check_qwen_book_continuous_training.py'
      - 'tests/test_qwen_book_sweep_v2.py'
      - 'run_book_sweep_windows.cmd'
      - 'configs/qwen14b_book_sweep_v1.json'
      - 'scripts/qwen_book_sweep.py'
      - 'scripts/check_qwen_book_sweep_training.py'
      - 'tests/test_qwen_book_sweep_v1.py'
      - 'run_book_training_windows.cmd'
      - 'configs/qwen14b_book_loop_v3.json'
      - 'scripts/qwen_book_loop.py'
      - 'scripts/check_qwen_book_loop_training.py'
      - 'tests/test_qwen_book_loop_v3.py'
      - 'tests/test_qwen_curriculum_v2.py'
      - 'tests/test_qwen_overnight_worker.py'
      - 'configs/qwen14b_curriculum_v2.json'
      - 'data/knowledge/qwen_curriculum_v2/**'
      - 'tests/test_qwen_research_v1.py'
      - 'tests/test_qwen_curriculum_candidate_v1.py'
      - 'data/knowledge/qwen_curriculum_v2/candidate_11952_manifest.json'
      - 'configs/qwen32b_v1.json'
      - 'configs/qwen14b_v1.json'
      - 'requirements-qwen.txt'
      - 'data/knowledge/qwen_research/**'
      - 'run_qwen_research.py'
      - '.github/workflows/qwen_research_v1.yml'
  pull_request:
    paths:
      - 'src/wengua/qwen_*.py'
      - 'src/wengua/qwen8b_*.py'
      - 'tests/test_qwen8b_book_v1.py'
      - 'scripts/*qwen*.py'
      - 'tests/test_qwen_research_v1.py'
      - 'configs/qwen32b_v1.json'
      - 'configs/qwen14b_v1.json'
      - 'requirements-qwen.txt'
      - 'data/knowledge/qwen_research/**'
permissions:
  contents: read
jobs:
  cpu-interface-not-32b-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qwen.txt
      - name: Source splits retrieval chart and no-outcome-supervision contracts (stdlib)
        run: python -m unittest tests.test_qwen_research_v1 tests.test_qwen_curriculum_candidate_v1 tests.test_qwen_overnight_worker tests.test_qwen_curriculum_v2 -v
      - name: Tiny CPU test dependencies (no bitsandbytes or 32B weights)
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1
      - name: Real Qwen3 tokenizer plus tiny random Qwen3 LoRA fit and independent reload
        run: python -m scripts.check_qwen_training
      - name: Actual tiny Qwen3 optimizer checkpoint resume, stage continuation and paired generation
        run: python -m scripts.check_qwen_curriculum_training
      - name: Actual tiny Qwen3 book-only loop, interruption restore and final report
        run: python -m scripts.check_qwen_book_loop_training
      - name: Actual tiny Qwen3 independent parameter trials, explicit restore and test isolation
        run: python -m scripts.check_qwen_book_sweep_training
      - name: Continuous Adam across epochs, exact optimizer resume and adaptive-stage isolation
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m scripts.check_qwen_book_continuous_training
      - name: Fresh process per unit, existing probe reuse and cross-process optimizer restore
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m scripts.check_qwen_book_isolated_training
      - name: Actual cold and warm Trainer loss routes, bounded projection and restoration (no weights)
        run: python -m scripts.check_qwen8b_loss_path
      - name: 8B pinned tokenizer, chunked loss and gradient equivalence, pressure reuse and optimizer restore (CPU only)
        run: python -m scripts.check_qwen8b_training
      - uses: actions/upload-artifact@v4
        with:
          name: tiny-qwen3-cpu-contract-not-32b-or-cuda
          path: |
            local/qwen14b_v1/tiny_integration.json
            local/qwen_curriculum_v2/tiny_integration.json
            local/qwen_book_loop_v3/tiny_integration.json
            local/qwen_book_sweep_v1/tiny_integration.json
            local/qwen_book_sweep_v2/tiny_integration.json
            local/qwen_book_sweep_v2/isolated_integration.json
            local/qwen8b_book_v1/tiny_integration.json
            local/qwen8b_book_v1/loss_route_integration.json

  windows-book-loop-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows locks, source-only resume contracts and UTF-8 CLI (no GPU)
        run: python -X utf8 -m unittest tests.test_qwen_book_loop_v3 tests.test_qwen_book_sweep_v1 tests.test_qwen_book_sweep_v2 -v
      - name: Actual Windows virtualenv redirector PID and worker receipts (stdlib only)
        shell: pwsh
        run: |
          python -m venv --without-pip local/worker_contract_env
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          & local/worker_contract_env/Scripts/python.exe -X utf8 -m unittest tests.test_qwen_book_sweep_v2 -v
          if ($LASTEXITCODE -ne 0) { throw "venv worker contract failed" }
      - name: 8B profile and fresh workers in actual Windows virtualenv (no GPU or model weights)
        shell: pwsh
        run: |
          & local/worker_contract_env/Scripts/python.exe -X utf8 -m unittest tests.test_qwen8b_book_v1 -v
          if ($LASTEXITCODE -ne 0) { throw "8B venv worker contract failed" }
      - name: 8B UTF-8 help, bounded plan and missing environment guard
        shell: pwsh
        run: |
          python -X utf8 run_qwen8b_research.py --help
          if ($LASTEXITCODE -ne 0) { throw "8B help failed" }
          python -X utf8 run_qwen8b_research.py plan
          if ($LASTEXITCODE -ne 0) { throw "8B plan failed" }
          cmd /c run_qwen8b_research_windows.cmd
          if ($LASTEXITCODE -ne 1) { throw "Expected missing-env refusal for 8B" }
          exit 0
      - name: Windows UTF-8 launcher help
        run: python -X utf8 run_qwen_book_loop.py --help
      - name: CMD launcher preserves absent environment without starting training
        shell: pwsh
        run: |
          cmd /c run_book_training_windows.cmd
          if ($LASTEXITCODE -ne 1) { throw "Expected a missing-env refusal in fresh CI checkout" }
          exit 0
      - name: Windows parameter sweep CLI help
        run: python -X utf8 run_qwen_book_sweep.py --help
      - name: Windows sweep plan has nine configs and starts no training
        run: python -X utf8 run_qwen_book_sweep.py plan
      - name: CMD sweep launcher absent environment guard
        shell: pwsh
        run: |
          cmd /c run_book_sweep_windows.cmd
          if ($LASTEXITCODE -ne 1) { throw "Expected missing-env refusal" }
          exit 0
      - name: Windows continuous staged research help
        run: python -X utf8 run_qwen_book_sweep_v2.py --help
      - name: Windows staged plan includes all-linear r32 and 4096
        run: python -X utf8 run_qwen_book_sweep_v2.py plan
      - name: CMD continuous research launcher absent environment guard
        shell: pwsh
        run: |
          cmd /c run_book_research_v2_windows.cmd
          if ($LASTEXITCODE -ne 1) { throw "Expected missing-env refusal" }
          exit 0

  windows-8b-real-loss-route:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual Transformers and CPU Torch dependencies (no CUDA or model downloads)
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1
      - name: Actual Windows venv cold imports and previously bound Trainer alias
        shell: pwsh
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -m venv --system-site-packages --without-pip local/loss_route_env
          if ($LASTEXITCODE -ne 0) { throw "loss-route venv failed" }
          & local/loss_route_env/Scripts/python.exe -X utf8 -m scripts.check_qwen8b_loss_path
          if ($LASTEXITCODE -ne 0) { throw "Actual Windows Trainer loss route failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-8b-actual-trainer-loss-route-not-cuda
          path: local/qwen8b_book_v1/loss_route_integration.json
