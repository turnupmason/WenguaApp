name: Health Conditional Evidence Review Preview (V-next, V3.9.1 preserved)
on:
  push:
    branches: [main]
    paths:
      - 'src/wengua/health_severity_vnext_review.py'
      - 'src/wengua/health_palace_sequence_vnext.py'
      - 'src/wengua/domain_selected_energy_vnext.py'
      - 'src/wengua/health_palace_detailed_vnext.py'
      - 'src/wengua/health_81_excel_catalog_vnext.py'
      - 'src/wengua/health_reading_template_vnext.py'
      - 'src/wengua/health_quant_overlay_vnext.py'
      - 'data/knowledge/health_81_excel_20261025/81_pairs.tsv'
      - 'data/templates/health_severity_vnext/reading_template.json'
      - 'src/wengua/health_role_majority_vnext.py'
      - 'src/wengua/health_macro_facts_vnext.py'
      - 'src/wengua/health_five_level_quant_vnext.py'
      - 'src/wengua/health_quant_overlay_vnext.py'
      - 'src/wengua/health_intrinsic_scoring_vnext.py'
      - 'src/wengua/health_relationship_language_vnext.py'
      - 'src/wengua/casting_chai_bu_audit_vnext.py'
      - 'data/knowledge/score_models/health_severity_vnext/**'
      - 'src/wengua/selected_duel_table_vnext.py'
      - 'src/wengua/user_domain_matrices_20261023.py'
      - 'src/wengua/health_full_role_network_vnext.py'
      - 'src/wengua/factor_energy_25_rules.py'
      - 'src/wengua/factor_energy_combinations.py'
      - 'src/wengua/health_tianrui_25_matrix.py'
      - 'src/wengua/qualitative_month_palace.py'
      - 'src/wengua/health_text_pipeline_vnext_review.py'
      - 'tests/test_health_vnext_conditional_review.py'
      - 'tests/test_health_full_role_network_vnext.py'
      - 'tests/test_domain_selected_energy_vnext.py'
      - 'tests/test_user_exact_energy_duel_grids_vnext.py'
      - 'tests/test_user_domain_matrices_20261023.py'
      - 'tests/test_health_complete_palace_vnext.py'
      - 'tests/test_health_81_excel_live_template_20261025.py'
      - 'tests/test_health_void_signed_scope_20261025.py'
      - 'tests/test_health_first_macro_vnext.py'
      - 'tests/test_health_five_level_quant_vnext.py'
      - 'tests/test_health_quant_overlay_vnext.py'
      - 'tests/test_health_intrinsic_scoring_vnext.py'
      - 'tests/test_health_relationship_language_vnext.py'
      - 'tests/test_casting_chai_bu_user_process_vnext.py'
      - 'tests/test_health_user_final_signed_template_vnext.py'
      - 'tests/test_health_door_break_exception_vnext.py'
      - 'scripts/preview_health_random_complete_20261024.py'
      - 'scripts/preview_health_random_2025_intrinsic_vnext.py'
      - 'scripts/archive_health_intrinsic_sqlite_20261024.py'
      - 'tests/test_factor_energy_25_rules.py'
      - 'tests/test_factor_energy_combinations.py'
      - 'tests/test_health_tianrui_25_matrix.py'
      - 'scripts/preview_health_tianrui_25.py'
      - 'scripts/preview_health_vnext_conditional.py'
      - '.github/workflows/health_vnext_conditional_review.yml'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify new gate, unique actual facts, abstention, four unchanged V3.9.1 readings
        run: |
          python -m unittest discover -s tests -p test_health_tianrui_25_matrix.py -v
          python -m unittest discover -s tests -p test_health_vnext_conditional_review.py -v
          python -m unittest discover -s tests -p test_health_full_role_network_vnext.py -v
          python -m unittest discover -s tests -p test_domain_selected_energy_vnext.py -v
          python -m unittest discover -s tests -p test_user_exact_energy_duel_grids_vnext.py -v
          python -m unittest discover -s tests -p test_user_domain_matrices_20261023.py -v
          python -m unittest discover -s tests -p test_health_complete_palace_vnext.py -v
          python -m unittest discover -s tests -p test_health_81_excel_live_template_20261025.py -v
          python -m unittest discover -s tests -p test_health_void_signed_scope_20261025.py -v
          python -m unittest discover -s tests -p test_health_first_macro_vnext.py -v
          python -m unittest discover -s tests -p test_health_five_level_quant_vnext.py -v
          python -m unittest discover -s tests -p test_health_quant_overlay_vnext.py -v
          python -m unittest discover -s tests -p test_health_intrinsic_scoring_vnext.py -v
          python -m unittest discover -s tests -p test_health_relationship_language_vnext.py -v
          python -m unittest discover -s tests -p test_casting_chai_bu_user_process_vnext.py -v
          python -m unittest discover -s tests -p test_health_user_final_signed_template_vnext.py -v
          python -m unittest discover -s tests -p test_health_door_break_exception_vnext.py -v
          python -m unittest discover -s tests -p test_factor_energy_25_rules.py -v
          python -m unittest discover -s tests -p test_factor_energy_combinations.py -v
          python -m unittest discover -s tests -p test_health_v391_public_auto_cast.py -v
      - name: Create before and after example report from independent source casts
        run: |
          python -m scripts.preview_health_vnext_conditional "artifacts/vnext_review_examples_python_${{ matrix.python-version }}.json"
          python -m scripts.preview_health_tianrui_25 "artifacts/tianrui_25_python_${{ matrix.python-version }}.json"
          python -m scripts.preview_health_random_complete_20261024 "artifacts/random_health_complete_python_${{ matrix.python-version }}.json"
          python -m scripts.preview_health_random_2025_intrinsic_vnext "artifacts/random_health_2025_intrinsic_python_${{ matrix.python-version }}.json"
      - name: Preserve comparison and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-vnext-review-examples-python-${{ matrix.python-version }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn
