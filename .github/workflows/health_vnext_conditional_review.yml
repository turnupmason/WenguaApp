name: Health Conditional Evidence Review Preview (V-next, V3.9.1 preserved)
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify new gate, unique actual facts, abstention, four unchanged V3.9.1 readings
        run: |
          python -m unittest discover -s tests -p test_health_tianrui_25_matrix.py -v
          python -m unittest discover -s tests -p test_health_vnext_conditional_review.py -v
          python -m unittest discover -s tests -p test_health_full_role_network_vnext.py -v
          python -m unittest discover -s tests -p test_domain_selected_energy_vnext.py -v
          python -m unittest discover -s tests -p test_user_exact_energy_duel_grids_vnext.py -v
          python -m unittest discover -s tests -p test_user_domain_matrices_20261023.py -v
          python -m unittest discover -s tests -p test_health_complete_palace_vnext.py -v
          python -m unittest discover -s tests -p test_health_81_excel_live_template_20261025.py -v
          python -m unittest discover -s tests -p test_health_void_signed_scope_20261025.py -v
          python -m unittest discover -s tests -p test_health_first_macro_vnext.py -v
          python -m unittest discover -s tests -p test_health_five_level_quant_vnext.py -v
          python -m unittest discover -s tests -p test_health_quant_overlay_vnext.py -v
          python -m unittest discover -s tests -p test_health_intrinsic_scoring_vnext.py -v
          python -m unittest discover -s tests -p test_health_relationship_language_vnext.py -v
          python -m unittest discover -s tests -p test_casting_chai_bu_user_process_vnext.py -v
          python -m unittest discover -s tests -p test_health_user_final_signed_template_vnext.py -v
          python -m unittest discover -s tests -p test_health_door_break_exception_vnext.py -v
          python -m unittest discover -s tests -p test_factor_energy_25_rules.py -v
          python -m unittest discover -s tests -p test_factor_energy_combinations.py -v
          python -m unittest discover -s tests -p test_health_v391_public_auto_cast.py -v
      - name: Create before and after example report from independent source casts
        run: |
          python -m scripts.preview_health_vnext_conditional "artifacts/vnext_review_examples_python_${{ matrix.python-version }}.json"
          python -m scripts.preview_health_tianrui_25 "artifacts/tianrui_25_python_${{ matrix.python-version }}.json"
          python -m scripts.preview_health_random_complete_20261024 "artifacts/random_health_complete_python_${{ matrix.python-version }}.json"
          python -m scripts.preview_health_random_2025_intrinsic_vnext "artifacts/random_health_2025_intrinsic_python_${{ matrix.python-version }}.json"
      - name: Preserve comparison and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-vnext-review-examples-python-${{ matrix.python-version }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn
