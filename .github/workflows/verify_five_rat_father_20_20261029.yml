name: Five-Rat Father-20 Calendar vs Person-Role Regression

on:
  push:
    paths:
      - '.github/workflows/verify_five_rat_father_20_20261029.yml'
      - 'tests/test_five_rat_father_20_separate_from_signifier_20261029.py'
      - 'src/wengua/casting_shenqi.py'
      - 'src/wengua/core.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert 720 legal day-hour pairs and uploaded father 20
        run: |
          python -m unittest discover -s tests -p 'test_five_rat_father_20_separate_from_signifier_20261029.py' -v
