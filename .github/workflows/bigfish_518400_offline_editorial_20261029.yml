name: BigFish actual Nov2026-Mar2027 clock and 518400 legacy contract

on:
  push:
    branches: [main]
    paths:
      - 'scripts/wengua_bigfish_518400_offline_editorial_20261029.py'
      - 'src/wengua/astro_calendar.py'
      - 'data/calendar/strict_jieqi_moshier_2025_2040.json'
      - 'tests/test_bigfish_518400_offline_editorial_20261029.py'
      - 'tests/test_bigfish_518400_role_and_natal_20261029.py'
      - 'tests/test_bigfish_node_runtime_pycharm_20261029.py'
      - 'tests/test_bigfish_1100_father_jia_preflight_20261029.py'
      - 'tests/test_bigfish_real_clock_nov2026_mar2027_20261031.py'
      - 'tests/test_strict_jieqi_all_385_crossings_20261031.py'
      - 'tests/test_bigfish_all_22_signifiers_loop_20261031.py'
      - 'tests/test_health_v90_four_sibling_relation_source_20261031.py'
      - 'tests/test_health_v90_four_friend_sex_age_source_20261031.py'
      - 'scripts/preview_health_v90_six_real_random_20261031.py'
      - 'tests/test_bigfish_518400_role_and_natal_20261029.py'
      - 'src/wengua/health_dynamic_v21.py'
      - 'src/wengua/domain_selected_energy_vnext.py'
      - 'src/wengua/health_quant_overlay_vnext.py'
      - 'data/knowledge/phrase_library/health_v20/actor_profiles.json'
      - '.github/workflows/bigfish_518400_offline_editorial_20261029.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-offline-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile complete standalone Python source
        run: python -m py_compile scripts/wengua_bigfish_518400_offline_editorial_20261029.py
      - name: Historical book calendar plus strict JieQi policy test
        run: python -m unittest discover -s tests -p 'test_astro_calendar_book_timing_v15.py' -v
      - name: Real SQLite CSV XLSX JSONL no-overwrite/failure tests
        run: python -m unittest discover -s tests -p 'test_bigfish_518400_offline_editorial_20261029.py' -v

      - name: Live pinned Wengua actor source/real chart person and natal verification
        run: python -m unittest discover -s tests -p 'test_bigfish_518400_role_and_natal_20261029.py' -v

      - name: PyCharm existing-install Node PATH and worker regression
        run: python -m unittest discover -s tests -p 'test_bigfish_node_runtime_pycharm_20261029.py' -v

      - name: Uploaded 1100 father Jia-years safe scheduling, resume and no-overwrite regression
        run: python -m unittest discover -s tests -p 'test_bigfish_1100_father_jia_preflight_20261029.py' -v

      - name: Actual 121-day clock 1452 slots DST exact Jie and immutable real XLSX
        run: python -m unittest discover -s tests -p 'test_bigfish_real_clock_nov2026_mar2027_20261031.py' -v

      - name: Every 2025-2040 UTC JieQi transition and 2041 sentinel (385)
        run: python -m unittest discover -s tests -p 'test_strict_jieqi_all_385_crossings_20261031.py' -v
      - name: V9.0 four siblings actual relation source and palace strengths
        run: python -m unittest discover -s tests -p 'test_health_v90_four_sibling_relation_source_20261031.py' -v
      - name: V9.0 four friends complete sex by relative age conditional palace routing
        run: python -m unittest discover -s tests -p 'test_health_v90_four_friend_sex_age_source_20261031.py' -v

      - name: Six deterministic random real calendar V9.0 Chinese readings
        run: |
          python scripts/preview_health_v90_six_real_random_20261031.py | tee v90_six_real_cast_previews.txt
          test "$(grep -c 'V9.0 [1-6]/6' v90_six_real_cast_previews.txt)" = "6"
      - name: Preserve six full real cast previews and retained failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v90-six-real-random-sibling-friend-readings
          path: v90_six_real_cast_previews.txt
          if-no-files-found: warn
          retention-days: 90

      - name: All 24 real actor identities and 29 sex-condition sequential loops
        run: python -m unittest discover -s tests -p 'test_bigfish_all_22_signifiers_loop_20261031.py' -v
