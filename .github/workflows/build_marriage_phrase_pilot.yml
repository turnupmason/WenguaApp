name: Marriage phrase prompt and timing regression (no duplicate archival)
on:
  push:
    branches: [main]
    paths:
      - 'src/wengua/timing_engine.py'
      - 'prompts/marriage_reading_v1.md'
      - 'tests/test_marriage_phrase_pilot.py'
      - '.github/workflows/build_marriage_phrase_pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Run marriage timing and phrase pilot guard tests
        run: python -m unittest discover -s tests -p test_marriage_phrase_pilot.py -v
      - name: Verify already-versioned full 194-book-case SQLite remains immutable
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,sqlite3
          root=Path('archives/sqlite')
          db=root/'WenguaApp_双书194案例_婚姻断语V1_完整研究库.sqlite3'
          xz=root/'WenguaApp_双书194案例_婚姻断语V1_完整研究库.sqlite3.xz'
          mf=root/'shenqi21_kaiwu22_marriage_phrase_v1_manifest.json'
          if not all(x.exists() for x in (db,xz,mf)):
           raise RuntimeError('Full V1 archive missing; use canonical build_marriage_phrase_archive.yml')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads(mf.read_text('utf8'))
          assert h(db)==m['sha256'] and h(xz)==m['xz_sha256']
          with sqlite3.connect(db) as con:
           assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
           assert con.execute('PRAGMA foreign_key_check').fetchall()==[]
           assert con.execute('SELECT COUNT(*) FROM cases').fetchone()[0]==194
           assert con.execute('SELECT COUNT(*) FROM phrase_template_drafts').fetchone()[0]==4
          print('This run is review-only. For updated GPT prompt V1.1, create a distinct versioned SQLite; do not overwrite V1.0 archive.')
          PY
